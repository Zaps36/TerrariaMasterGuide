/* ------------------------------------------------------------------- tabs */

/**
 * Tab strip that swaps content in place.
 * @param {Array<{id:string,label:string,icon?:string,cls?:string}>} items
 * @param {(id:string)=>Node} render
 */
/** Remembers the selected tab across page re-renders. */
const tabMemory = new Map();

function tabs(items, render, { initial = null, onSwitch = null, ariaLabel = 'Tabs', persist = true } = {}) {
  const remembered = persist ? tabMemory.get(ariaLabel) : null;
  const valid = (id) => items.some((item) => item.id === id);
  let active = (valid(remembered) && remembered) || (valid(initial) && initial) || items[0]?.id;
  if (persist) tabMemory.set(ariaLabel, active);
  const body = h('div.tabbody');
  const strip = h('div.tabs', { role: 'tablist', 'aria-label': ariaLabel });

  function paint() {
    mount(strip, ...items.map((item) =>
      h(
        'button.tab',
        {
          type: 'button',
          role: 'tab',
          'aria-selected': item.id === active ? 'true' : 'false',
          class: item.id === active ? 'is-active' : null,
          dataset: { class: item.cls || null, focusKey: `tab:${ariaLabel}:${item.id}` },
          onclick: () => {
            if (active === item.id) return;
            active = item.id;
            if (persist) tabMemory.set(ariaLabel, active);
            paint();
            mount(body, render(active));
            if (onSwitch) onSwitch(active);
          },
        },
        item.icon ? glyph(item.icon) : null,
        item.label
      )
    ));
  }

  paint();
  mount(body, render(active));
  return frag(strip, body);
}

/* ------------------------------------------------------------------ modal */

let openModals = 0;

function openModal({ title, subtitle, body, footer, sprite = null }) {
  const root = document.getElementById('modal-root');
  const previousFocus = document.activeElement;

  const close = () => {
    backdrop.remove();
    openModals -= 1;
    if (openModals === 0) document.body.style.overflow = '';
    document.removeEventListener('keydown', onKey);
    if (previousFocus && previousFocus.focus) previousFocus.focus();
  };

  const onKey = (event) => {
    if (event.key === 'Escape') {
      event.stopPropagation();
      close();
    }
  };

  const dialog = h(
    'div.modal',
    { role: 'dialog', 'aria-modal': 'true', 'aria-label': typeof title === 'string' ? title : 'Details' },
    h(
      'div.modal__head',
      sprite,
      h(
        'div',
        h('h2.modal__title', title),
        subtitle ? h('p.small.muted', { style: { margin: '2px 0 0' } }, subtitle) : null
      ),
      h('button.modal__close', { type: 'button', 'aria-label': 'Close', onclick: close }, '✕')
    ),
    h('div.modal__body', body),
    footer ? h('div.modal__body', { style: { paddingTop: '0' } }, footer) : null
  );

  const backdrop = h(
    'div.modal-backdrop',
    {
      onclick: (event) => {
        if (event.target === backdrop) close();
      },
    },
    dialog
  );

  root.append(backdrop);
  openModals += 1;
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onKey);
  dialog.querySelector('.modal__close')?.focus();
  return close;
}

/* ------------------------------------------------------------------ toast */

function toast(message, { tone = '', icon = '✓', duration = 2400 } = {}) {
  const root = document.getElementById('toast-root');
  const node = h('div.toast', { class: tone ? `toast--${tone}` : null }, glyph(icon), message);
  root.append(node);
  setTimeout(() => {
    node.classList.add('is-out');
    setTimeout(() => node.remove(), 260);
  }, duration);
}

/* ---------------------------------------------------------------- sparkle */

function sparkleBurst(anchor) {
  if (getState().display.reducedMotion) return;
  const rect = anchor.getBoundingClientRect();
  const cx = rect.left + Math.min(rect.width, 40) / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#F2C14E', '#72D572', '#F4F1DE', '#6CB4EE'];

  for (let i = 0; i < 7; i += 1) {
    const dx = (Math.random() - 0.5) * 60;
    const dy = -18 - Math.random() * 34;
    const dot = h('span.sparkle', {
      style: {
        left: `${cx}px`,
        top: `${cy}px`,
        background: colors[i % colors.length],
        '--dx': `${dx}px`,
        '--dy': `${dy}px`,
        animationDelay: `${i * 18}ms`,
      },
    });
    document.body.append(dot);
    setTimeout(() => dot.remove(), 900);
  }
}

/* ------------------------------------------------------- global search --- */

function globalSearch() {
  const results = h('div.search__results', { hidden: true, role: 'listbox' });
  let cursor = -1;
  let flat = [];

  const input = h('input.search__input', {
    type: 'search',
    placeholder: 'Search bosses, items, NPCs…',
    'aria-label': 'Global search',
    autocomplete: 'off',
    oninput: (event) => paint(event.target.value),
    onkeydown: (event) => {
      if (event.key === 'Escape') {
        close();
        input.blur();
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!flat.length) return;
        cursor = event.key === 'ArrowDown'
          ? (cursor + 1) % flat.length
          : (cursor - 1 + flat.length) % flat.length;
        highlight();
      } else if (event.key === 'Enter' && cursor >= 0 && flat[cursor]) {
        event.preventDefault();
        go(flat[cursor].href);
      }
    },
    onfocus: (event) => {
      if (event.target.value.trim().length >= 2) paint(event.target.value);
    },
  });

  function highlight() {
    qsa('.search__result', results).forEach((node, index) => {
      node.classList.toggle('is-cursor', index === cursor);
      if (index === cursor) node.scrollIntoView({ block: 'nearest' });
    });
  }

  function close() {
    results.hidden = true;
    cursor = -1;
    flat = [];
  }

  function go(href) {
    close();
    input.value = '';
    navigate(href.replace(/^#/, ''));
  }

  function paint(value) {
    const groups = searchGrouped(value, 30);
    flat = groups.flatMap((g) => g.results);
    cursor = -1;

    if (!value.trim() || value.trim().length < 2) {
      close();
      return;
    }

    if (!flat.length) {
      mount(
        results,
        h('p.search__group-label', 'No results'),
        h(
          'p.small.muted',
          { style: { padding: '4px 8px 10px' } },
          'No adventurer has discovered anything matching that search.'
        )
      );
      results.hidden = false;
      return;
    }

    mount(
      results,
      groups.map((group) =>
        h(
          'div',
          h('p.search__group-label', group.label),
          group.results.map((entry) =>
            h(
              'button.search__result',
              { type: 'button', role: 'option', onclick: () => go(entry.href) },
              spriteTile(entry.sprite, { size: 22, palette: entry.tint ? tint(entry.tint) : {} }),
              h('span.grow', entry.name),
              h('span.search__result-sub', entry.kindLabel)
            )
          )
        )
      )
    );
    results.hidden = false;
  }

  const wrap = h('div.search', h('span.search__icon', '🔍'), input, results);

  document.addEventListener('click', (event) => {
    if (!wrap.contains(event.target)) close();
  });

  return wrap;
}

      MOBILE_ITEMS.map((item) =>

/* --------------------------------------------------------------- drawer --- */

function openDrawer() {
  const close = () => {
    backdrop.remove();
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (event) => {
    if (event.key === 'Escape') close();
  };
  const drawer = h('div.drawer', sidebar({ inDrawer: true, onNavigate: close }));
  const backdrop = h(
    'div.drawer-backdrop',
    {
      onclick: (event) => {
        if (event.target === backdrop) close();
      },
    },
    drawer
  );
  document.body.append(backdrop);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onKey);
}

/* ---------------------------------------------------------------- shell --- */

/**
 * Build the shell and return the outlet the router renders into.
 */
function buildShell(appRoot) {
  const outlet = h('div', { id: 'main-content', tabindex: '-1' });

  const shell = h(
    'div.shell',
    sidebar(),
    h('div.shell__main', topbar(openDrawer), outlet),
    bottomNav()
  );

  mount(appRoot, shell);

  // keep sidebar world summary fresh
  subscribe(() => {
    qsa('[data-role="world-summary"]', shell).forEach((node) => {
      node.replaceWith(worldSummary());
    });
  });

  return outlet;
}

/** Called by the router after every navigation. */
function setActiveNav(path) {
  activeNavId = navIdForPath(path);
  qsa('[data-nav]').forEach((node) => {
    const isActive = node.dataset.nav === activeNavId;
    node.classList.toggle('is-active', isActive);
    if (node.classList.contains('navlink')) {
      if (isActive) node.setAttribute('aria-current', 'page');
      else node.removeAttribute('aria-current');
    }
  });
}

function presetToMap(preset, evil) {
  const map = {};
  for (const id of preset.bosses) {
    map[id === 'EVIL' ? evilBossId(evil) : id] = true;
  }
  return map;
}

/** Which preset best matches the current defeated map. */
function detectPreset(state) {
  const evil = state.world.evil;
  for (let i = PROGRESS_PRESETS.length - 1; i >= 0; i -= 1) {
    const preset = PROGRESS_PRESETS[i];
    const map = presetToMap(preset, evil);
    const keys = Object.keys(map);
    if (keys.length && keys.every((k) => state.defeated[k])) return preset.id;
  }
  return Object.keys(state.defeated).length ? 'started' : 'new';
}

const STEPS = [
  { id: 1, label: 'Difficulty' },

function setupPage() {
  let step = 1;

              step = s.id;

            extra: h('p.tiny.dim', { style: { margin: 0 } }, c.desc),

              setPlayerClass(c.id);
              paint();

        'div',
        { style: { marginTop: '4px' } },

          icon: '🎲',
          name: 'Mixed / Not sure',

          selected: state.player.class === 'unsure',
          accent: 'var(--gold)',
          onSelect: () => {
            setPlayerClass('unsure');
            paint();
          },
        })
      )

  function stepThree() {
    const state = getState();
    return h(
      'div.stack',
      h('p.eyebrow', 'Step 3 of 4'),
      h('h1', 'Which evil does your world have?'),

            icon: e.icon,
            name: e.name,
            desc: e.desc,
            selected: state.world.evil === e.id,
            accent: e.accent,
            extra: h(
              'div.stack',
              { style: { gap: '8px' } },
              h('div.row', sprite(boss.sprite, { size: 34, alt: '' }), h('span.small', `Boss: ${boss.name}`)),
              h('p.tiny.dim', { style: { margin: 0 } }, e.note),

                'aria-pressed': preset.id === active ? 'true' : 'false',
                onclick: () => {
                  setDefeatedMap(presetToMap(preset, getState().world.evil));
                  paint();
                  toast(`Progress set: ${preset.label}`, { tone: 'success' });
                },
              },
              h('span.stagepicker__num', `${index + 1}`),
              h('span.grow', h('b', preset.label), h('span.check__note', preset.note)),
              preset.id === active ? badge('Current', { variant: 'gold' }) : null
            )
          )
        )
      ),
      h(
        'p.tiny.dim',
        'You can also tick bosses off individually later on the Progression page — this is just a fast start.'
      )
    );
  }

  function nav() {
    const isLast = step === STEPS.length;
    return h(
      'div.setup__nav',
      step > 1
        ? btn('Back', {
            variant: 'ghost',
            icon: '←',
            onClick: () => {
              step -= 1;
              paint();
            },
          })
        : btn('Home', { variant: 'ghost', href: '#/', icon: '←' }),
      h('span.tiny.dim', `Step ${step} of ${STEPS.length}`),
      isLast

            variant: 'primary',
            iconAfter: '→',
            onClick: () => {
              completeSetup();

            },
          })
        : btn('Next', {
            variant: 'primary',
            iconAfter: '→',
            onClick: () => {
              step += 1;
              paint();
            },
          })
    );
  }

  function paint() {
    const bodies = { 1: stepOne, 2: stepTwo, 3: stepThree, 4: stepFour };
    mount(root, stepper(), bodies[step](), nav());
  }

  paint();
  return root;
}

/**
 * The recommendation engine.
 *
 * Deterministic rules only — no AI, no randomness. Given the player's state
 * it answers: what next, what did you miss, and what is optional but worth it.
 */


/**
 * The headline "What should I do next?" recommendation.
 * Returns a view-model, never null (endgame gets its own card).
 */
function whatNext(state, world) {
  const stageId = currentStageId(state);
  const stage = STAGE_MAP[stageId];
  const objective = nextMainObjective(state, world.evil);

  if (!objective) {
    const section = worldPrepSectionForStage(stageId);
    return {
      type: 'task',
      icon: '🏆',
      sprite: 'moon_lord',
      title: 'You beat Terraria',
      kicker: 'Post-Moon Lord',
      reason:
        'Luminite is unlocked. Craft the endgame armor sets, farm the Pumpkin and Frost Moons, and hunt the Zenith components.',
      difficulty: 5,
      stageId,
      prep: [
        { key: 'endgame:luminite', label: 'Craft a Luminite armor set' },
        { key: 'endgame:zenith', label: 'Collect every Zenith component sword' },
        { key: 'endgame:moons', label: 'Clear wave 15 of the Pumpkin Moon' },
        { key: 'endgame:frost', label: 'Clear wave 20 of the Frost Moon' },
        { key: 'endgame:build', label: 'Build something ridiculous' },
      ],
      cta: { label: 'Explore item database', href: '#/items' },
      section,
    };
  }

  const boss = objective.boss;

  // Special case from the spec's rules: fresh Hardmode = prepare, do not rush.
  if (objective.hardmodePrep) {
    const section = worldPrepSectionForStage(stageId);
    return {
      type: 'task',
      icon: '🔥',
      sprite: 'the_destroyer',
      title: 'Prepare for Hardmode',
      kicker: 'Recommended next objective',
      reason:
        'Hardmode enemies hit far harder than anything you have fought. Get a full Hardmode ore set and wings before you summon a mechanical boss.',
      difficulty: 3,
      stageId,
      prep: section.items.map((item) => ({
        key: item.global || `world:${section.id}:${item.id}`,
        label: item.label,
        note: item.note,
      })),
      cta: { label: 'Open world preparation', href: '#/world-prep' },
      then: { boss, label: `Then: ${boss.name}` },
      section,
    };
  }

  return {
    type: 'boss',
    icon: boss.kind === 'event' ? '🌙' : '👑',
    sprite: boss.sprite,
    boss,
    title: boss.kind === 'event' ? boss.name : `Defeat ${boss.name}`,
    kicker: 'Recommended next objective',
    reason: objective.reason,
    difficulty: boss.difficulty,
    stageId,
    prep: (boss.preparation || []).map((entry) => ({
      key: prepKey(boss.id, entry),
      label: entry.label,
      note: entry.note,
    })),
    cta: { label: `View ${boss.name} guide`, href: `#/bosses/${boss.id}` },
    section: worldPrepSectionForStage(stageId),
  };
}

/**
 * "You may have missed" — gentle, specific warnings based on what the player
 * has and has not ticked off.
 */
function missedThings(state, world) {
  const stageId = currentStageId(state);
  const at = (threshold) => stageAtOrAfter(stageId, threshold);
  const checked = (key) => Boolean(state.checks[key]);
  const beaten = (id) => Boolean(state.defeated[id]);
  const out = [];

  if (at('pre-skeletron') && !checked('gear:mobility')) {
    out.push({
      id: 'mobility',
      severity: 'danger',
      title: "You haven't marked a mobility accessory",
      body: 'Almost every early death is a movement problem. Boots and a double jump come before a better weapon.',
      itemId: at('early-hardmode') ? 'frostspark_boots' : 'spectre_boots',
      action: { label: 'View item', href: '#/items?q=boots' },
      fixKey: 'gear:mobility',
    });
  }

  if (at('pre-skeletron') && !checked('gear:hp300')) {
    out.push({
      id: 'hp300',
      severity: 'warning',
      title: 'You may be under 300 maximum health',
      body: 'Skeletron in Expert will delete a 200 HP character. Find five more Life Crystals.',
      itemId: 'life_crystal',
      action: { label: 'Life Crystal', href: '#/items?q=life' },
      fixKey: 'gear:hp300',
    });
  }

  if (at('pre-wof') && !checked('gear:hp400')) {
    out.push({
      id: 'hp400',
      severity: 'warning',
      title: 'Reach 400 health before the Wall of Flesh',
      body: 'Twenty Life Crystals is the pre-Hardmode cap. Hardmode is much harsher without it.',
      itemId: 'life_crystal',
      action: { label: 'World preparation', href: '#/world-prep' },
      fixKey: 'gear:hp400',
    });
  }

  if (at('early-hardmode') && !checked('gear:wings')) {
    out.push({
      id: 'wings',
      severity: 'danger',
      title: "You haven't marked a pair of wings",
      body: 'Wings are effectively mandatory for the mechanical bosses. Farm Wyverns for Souls of Flight.',
      itemId: 'demon_angel_wings',
      action: { label: 'View wings', href: '#/items?q=wings' },
      fixKey: 'gear:wings',
    });
  }

  if (at('pre-plantera') && !checked('world:pre-plantera:jungle-arena')) {
    out.push({
      id: 'jungle-arena',
      severity: 'warning',
      title: "You haven't prepared a Jungle arena before Plantera",
      body: 'Plantera chases you through blocks in phase two. Build the arena before you break the bulb.',
      itemId: null,
      action: { label: 'Prepare arena', href: '#/bosses/plantera' },
      fixKey: 'world:pre-plantera:jungle-arena',
    });
  }

  if (at('pre-plantera') && !checked('gear:hp500')) {
    out.push({
      id: 'hp500',
      severity: 'warning',
      title: 'Collect Life Fruit for 500 health',
      body: 'Twenty Life Fruit in the Hardmode Jungle takes you from 400 to 500 HP.',
      itemId: 'life_fruit',
      action: { label: 'Life Fruit', href: '#/items?q=life+fruit' },
      fixKey: 'gear:hp500',
    });
  }

  if (at('moon-lord') && !checked('gear:heart-statue')) {
    out.push({
      id: 'heart-statue',
      severity: 'warning',
      title: 'No Heart Statue arena marked',
      body: 'Wired Heart Statues are the single biggest quality-of-life upgrade for the Moon Lord fight.',
      itemId: null,
      action: { label: 'World preparation', href: '#/world-prep' },
      fixKey: 'gear:heart-statue',
    });
  }

  if (at('pre-skeletron') && !beaten('goblin_army')) {
    out.push({
      id: 'goblin',
      severity: 'info',
      title: 'You have not defeated a Goblin Army',
      body: 'It unlocks the Goblin Tinkerer: Rocket Boots, the Tinkerer\'s Workshop and accessory reforging.',
      itemId: 'rocket_boots',
      action: { label: 'Goblin Army', href: '#/bosses/goblin_army' },
    });
  }

  if (state.player.class === 'summoner' && at('pre-skeletron') && !beaten('queen_bee')) {
    out.push({
      id: 'queen-bee',
      severity: 'info',
      title: 'Summoners should not skip Queen Bee',
      body: 'Bee Armor and the Hornet Staff are the entire summoner early game.',
      itemId: 'bee_armor',
      action: { label: 'Queen Bee', href: '#/bosses/queen_bee' },
    });
  }

  if (at('lunar') && !beaten('duke_fishron')) {
    out.push({
      id: 'fishron',
      severity: 'info',
      title: 'Duke Fishron is still available',
      body: 'His drops (Tsunami, Razorblade Typhoon, Tempest Staff, Fishron Wings) are best-in-class before Moon Lord.',
      itemId: 'fishron_wings',
      action: { label: 'Duke Fishron', href: '#/bosses/duke_fishron' },
    });
  }

  return out;
}

/** "Optional but worth it" entries for the current stage. */
function optionalForStage(state) {
  const stageId = currentStageId(state);
  const list = OPTIONAL_WORTH_IT[stageId] || [];
  return list.map((entry) => ({
    ...entry,
    boss: BOSS_MAP[entry.id] || null,
    done: Boolean(state.defeated[entry.id]),
  }));
}

/** Which mechanical bosses are left (used on the dashboard). */
function mechStatus(state) {
  const done = MECH_BOSSES.filter((id) => state.defeated[id]);
  return { done: done.length, total: MECH_BOSSES.length, remaining: MECH_BOSSES.filter((id) => !state.defeated[id]) };
}

/** Loadout for the player's class at their current stage. */
function currentLoadout(state) {
  return getBuild(state.player.class, currentStageId(state));
}

/**

 */


const STATUS_LABEL = {
  done: 'Completed',
  available: 'Available',
  locked: 'Locked',
  next: 'Recommended next',
};

function bossSpriteTile(boss, size = 44, variant = '') {
  return spriteTile(boss.sprite, { size, alt: boss.name, variant });

/** Card used on the Bosses database page. */
function bossCard(boss, status) {
  const done = status === 'done';
  return h(
    'a.card',
    {
      href: `#/bosses/${boss.id}`,
      class: [done ? 'card--done' : null, status === 'locked' ? 'card--locked' : null].filter(Boolean),
      dataset: { focusKey: `bosscard:${boss.id}` },
    },
    done ? h('span.card__tick', { 'aria-label': 'Defeated' }, '✓') : null,
    h(
      'div.row',
      bossSpriteTile(boss, 48, status === 'next' ? 'gold' : ''),
      h(

        h('h4.card__title', { style: { margin: 0 } }, boss.name),
        h('p.tiny.dim', { style: { margin: '3px 0 0' } }, boss.title)
      )
    ),
    h(
      'div.card__meta',
      badge(boss.tier === 'hardmode' ? 'Hardmode' : 'Pre-Hardmode', { variant: boss.tier === 'hardmode' ? 'danger' : '' }),
      boss.optional ? badge('Optional', { variant: 'optional' }) : badge('Main', { variant: 'gold' }),
      boss.kind === 'event' ? badge('Event', {}) : null
    ),
    h(
      'div.row.row--between',
      h('span.row', h('span.tiny.dim', 'DIFFICULTY'), stars(boss.difficulty)),
      h('span.tiny.dim', `${boss.hp} HP`)
    ),
    h('p.small.muted', { style: { margin: 0 } }, `Gear tier: ${STAGE_MAP[boss.stage]?.label || boss.stage}`)
  );
}

/** Node used inside the progression tree. */
function bossNode(boss, status, { compact = false } = {}) {
  const classes = ['node'];
  if (status === 'done') classes.push('is-done');
  if (status === 'available') classes.push('is-available');
  if (status === 'locked') classes.push('is-locked');
  if (status === 'next') classes.push('is-next');

  return h(
    'a',
    {
      href: `#/bosses/${boss.id}`,
      class: classes,
      dataset: { focusKey: `node:${boss.id}` },
      'aria-label': `${boss.name} — ${STATUS_LABEL[status]}`,
    },
    status === 'next' ? h('span.node__flag', 'Do this next') : null,
    bossSpriteTile(boss, compact ? 34 : 42, status === 'next' ? 'gold' : ''),
    h(
      'span.node__info',
      h('span.node__name', boss.name),
      h(
        'span.node__meta',
        badge(STAGE_MAP[boss.stage]?.label || boss.stage, { variant: boss.tier === 'hardmode' ? 'danger' : '' }),
        boss.optional ? badge('Optional', { variant: 'optional' }) : null,
        h('span.row', stars(boss.difficulty))
      ),
      !compact && boss.unlocks?.length
        ? h('span.tiny.dim', { style: { display: 'block', marginTop: '4px' } }, `Unlocks: ${boss.unlocks[0]}`)
        : null
    ),
    h('span.node__status', { 'aria-hidden': 'true' }, status === 'done' ? '✓' : status === 'locked' ? '🔒' : '›')
  );
}

function treeLink(done = false) {
  return h('span.tree__link', { class: done ? 'tree__link--done' : null, 'aria-hidden': 'true' });
}

function hardmodeBand(label = 'HARDMODE BEGINS', icon = '🔥') {
  return h('div.tree__band', glyph(icon), label, glyph(icon));
}

/**
 * The "mark as defeated" control. Used on boss detail pages and cards.
 */
function defeatToggle(boss, { onChange = null, block = false, variant = 'primary' } = {}) {
  const done = isDefeated(boss.id);
  return btn(done ? 'Defeated ✓' : `Mark ${boss.name} defeated`, {
    variant: done ? 'success' : variant,
    block,
    focusKey: `defeat:${boss.id}`,
    onClick: (event) => {
      const now = toggleDefeated(boss.id);
      if (now) {
        sparkleBurst(event.currentTarget);
        toast(`${boss.name} defeated!`, { tone: 'success', icon: '👑' });
      } else {
        toast(`${boss.name} un-marked`, { icon: '↩' });
      }
      if (onChange) onChange(now);
    },
  });
}

/**

 */
function chainRow(ids, { onSelect = null, highlightLast = true } = {}) {
  const items = ids.map((id) => getItem(id)).filter(Boolean);
  const nodes = [];
  items.forEach((item, index) => {
    if (index > 0) nodes.push(h('span.chain__arrow', '▶'));
    nodes.push(
      h(
        'div.chain__step',
        chainNode(item, {
          onClick: onSelect,
          tag: highlightLast && index === items.length - 1 ? 'Final' : null,
        })
      )
    );
  });
  return h('div.scroll-x', h('div.chain', ...nodes));
}

/**
 * Crafting tree: several inputs joined by a bracket into one output.
 */
function craftTree(item, { onSelect = null } = {}) {
  if (!item?.craft) return null;
  const inputs = item.craft.inputs.map((input) => {
    const resolved = input.id ? getItem(input.id) : null;
    return resolved
      ? chainNode(resolved, { onClick: onSelect })
      : textNode(input.name || 'Unknown', { qty: input.qty > 1 ? input.qty : null });
  });

  return h(
    'div',
    h('p.tiny.muted', { style: { margin: '0 0 8px' } }, `Crafted at: ${item.craft.station}`),
    h(
      'div.scroll-x',
      h(
        'div.craft',
        h('div.craft__inputs', ...inputs),
        h('div.craft__brace'),
        h('div', chainNode(item, { tag: 'Result' }))
      )
    )
  );
}

/**

const TAG_LABELS = {
  best: { label: 'Recommended', classes: ['itemcard__tag'] },
  alt: { label: 'Alternative', classes: ['itemcard__tag', 'itemcard__tag--alt'] },
  luxury: { label: 'Luxury', classes: ['itemcard__tag', 'itemcard__tag--luxury'] },

/**
 * The workhorse item card used by loadouts, the item database and search.
 * @param {object} item
 * @param {{tag?:'best'|'alt'|'luxury', showStage?:boolean}} options
 */
function itemCard(item, { tag = null, showStage = false } = {}) {
  if (!item) return null;
  const tagInfo = tag ? TAG_LABELS[tag] : null;

  return h(
    'button.itemcard',

        tagInfo ? 'itemcard--tagged' : null,
        tag === 'best' ? 'itemcard--best' : null,
        tag === 'alt' ? 'itemcard--alt' : null,

      dataset: { focusKey: `item:${item.id}` },

/** Opens the item detail modal (spec §19). */
function openItemModal(itemId) {
  const item = typeof itemId === 'string' ? getItem(itemId) : itemId;
  if (!item) return;

  const usedForCrafts = craftedFrom(item.id).map((i) => i.name);
  const usedFor = [...new Set([...(item.usedFor || []), ...usedForCrafts])];

  const body = h(
    'div',
    { class: 'stack' },

    h(
      'div.row.row--wrap',
      rarityBadge(item.rarity),
      badge(item.type, {}),
      item.cls !== 'universal' ? badge(item.cls, { cls: item.cls }) : null,
      badge(STAGE_MAP[item.stage]?.label || item.stage, { variant: 'gold' }),
      item.evil ? badge(item.evil, { variant: 'optional' }) : null,
      h('span.row', h('span.tiny.dim', 'PICK'), stars(item.rating))
    ),

    item.desc ? h('p.lede', { style: { fontSize: '0.95rem' } }, item.desc) : null,

    statGrid(Object.entries(item.stats)),

    panel(
      { variant: 'deep' },
      h('h4', { style: { margin: '0 0 8px' } }, 'How to get it'),
      h('p.small.muted', { style: { margin: 0 } }, item.source || 'Found through normal progression.')
    ),

    item.craft
      ? panel(
          { variant: 'deep' },
          h('h4', { style: { margin: '0 0 8px' } }, 'Crafting tree'),
          craftTree(item, { onSelect: (next) => openItemModal(next.id) })
        )
      : null,

    usedFor.length
      ? panel(
          { variant: 'deep' },
          h('h4', { style: { margin: '0 0 8px' } }, 'Used for'),
          bullets(usedFor)
        )
      : null,

    item.tags?.length
      ? h('div.row.row--wrap', item.tags.map((t) => badge(t, { variant: 'optional' })))
      : null
  );

  openModal({
    title: item.name,
    subtitle: `${item.cls === 'universal' ? '' : `${item.cls} · `}${item.type}`.toUpperCase(),
    sprite: spriteTile(item.sprite, { size: 44, palette: tint(item.tint), variant: 'gold' }),
    body,
  });
}

/** Tiny inline reference used in prose. */
function itemPill(id) {
  const item = getItem(id);
  if (!item) return null;
  return h(
    'button.preppill',
    { type: 'button', onclick: () => openItemModal(item.id), title: item.name },
    sprite(item.sprite, { size: 16, palette: tint(item.tint) }),

  );

function itemSpriteOnly(id, size = 24) {
  const item = getItem(id);
  if (!item) return glyph('❔');
  return sprite(item.sprite, { size, palette: tint(item.tint), alt: item.name });
}

/* ===== src/components/progression-tree.js ===== */
/**
 * The progression tree: main chain + optional side content.
 */


/** Vertical main progression tree with status-aware nodes. */
function progressionTree(state, world, { compact = false } = {}) {
  const nodes = mainChainNodes(world.evil);
  const next = nextMainObjective(state, world.evil);
  const nextId = next?.boss?.id;

  const children = [];
  nodes.forEach((node, index) => {
    if (index > 0) {
      const previous = nodes[index - 1];
      const doneLink = previous.kind === 'boss' ? Boolean(state.defeated[previous.boss.id]) : false;
      children.push(treeLink(doneLink));
    }
    if (node.kind === 'band') {
      children.push(hardmodeBand(node.label, node.icon));
      return;
    }
    const status = state.defeated[node.boss.id]
      ? 'done'
      : node.boss.id === nextId
        ? 'next'
        : bossStatus(node.boss, state);
    children.push(bossNode(node.boss, status, { compact }));
  });

  return h('div.tree', ...children);
}

/** Optional / side bosses, clearly separated from the main chain. */
function optionalBossGrid(state, world) {
  const hidden = world.evil === 'crimson' ? 'eater_of_worlds' : 'brain_of_cthulhu';
  const bosses = OPTIONAL_BOSSES.map((id) => BOSS_MAP[id]).filter((b) => b && b.id !== hidden);

  if (!bosses.length) {
    return emptyState({ title: 'No optional content for this world' });
  }

  return h(
    'div.grid.grid--3',
    bosses.map((boss) => bossCard(boss, state.defeated[boss.id] ? 'done' : bossStatus(boss, state)))
  );
}

/** Small legend so the node states are not colour-only. */
function treeLegend() {
  return panel(
    { variant: 'deep' },
    panelHead('Legend'),
    h(
      'div.row.row--wrap',
      badge('✓  Completed', { variant: 'success' }),
      badge('›  Available', {}),
      badge('🔒  Locked', {}),
      badge('★  Recommended next', { variant: 'gold' }),
      badge('Optional', { variant: 'optional' })
    ),
    h(
      'p.tiny.dim',
      { style: { margin: '10px 0 0' } },
      'Optional bosses are never required to progress — they are shown separately so you always know what is mandatory.'
    )
  );
}

/**
 * Boss database (spec §14) — search + filters + card grid.
 */


const FILTERS = [
  { id: 'pre-hardmode', label: 'Pre-Hardmode', test: (b) => b.tier === 'pre-hardmode' },
  { id: 'hardmode', label: 'Hardmode', test: (b) => b.tier === 'hardmode' },
  { id: 'main', label: 'Main progression', test: (b) => !b.optional },
  { id: 'optional', label: 'Optional', test: (b) => b.optional },
  { id: 'event', label: 'Event', test: (b) => b.kind === 'event' },
  { id: 'todo', label: 'Not defeated', test: (b, state) => !state.defeated[b.id] },
];

function bossesPage({ query } = {}) {
  const state = getState();
  const world = state.world;
  const hidden = world.evil === 'crimson' ? 'eater_of_worlds' : 'brain_of_cthulhu';
  const next = nextMainObjective(state, world.evil);

  let search = query?.get('q') || '';
  let active = [];

  const results = h('div');

  function paint() {
    const q = search.trim().toLowerCase();
    const list = BOSSES.filter((boss) => {
      if (boss.id === hidden) return false;
      if (q && !`${boss.name} ${boss.title} ${boss.blurb}`.toLowerCase().includes(q)) return false;
      if (active.length && !active.every((id) => FILTERS.find((f) => f.id === id).test(boss, state))) return false;
      return true;
    }).sort((a, b) => a.order - b.order);

    if (!list.length) {
      mount(
        results,
        panel(
          {},
          emptyState({
            title: 'No bosses found',
            body: 'No adventurer has discovered anything matching that search. Try clearing a filter.',
            art: sprite('unknown', { size: 56 }),
            action: btn('Clear filters', {
              variant: 'ghost',
              onClick: () => {
                active = [];
                search = '';
                paint();
              },
            }),
          })
        )
      );
      return;
    }

    mount(
      results,
      h('p.tiny.dim', { style: { margin: '0 0 12px' } }, `${list.length} result${list.length === 1 ? '' : 's'}`),
      h(
        'div.grid.grid--3',
        list.map((boss) => {
          const status = state.defeated[boss.id]
            ? 'done'
            : boss.id === next?.boss?.id
              ? 'next'
              : bossStatus(boss, state);
          return bossCard(boss, status);
        })
      )
    );
  }

  const controls = h('div');

  function paintControls() {
    mount(
      controls,
      h(
        'div.filterbar',
        searchInput({
          placeholder: 'Search boss…',
          value: search,
          focusKey: 'boss-search',
          onInput: (value) => {
            search = value;
            paint();
          },
        }),
        chipGroup({
          label: 'Filter',
          options: FILTERS,
          selected: active,
          onToggle: (id) => {
            active = active.includes(id) ? active.filter((x) => x !== id) : [...active, id];
            paintControls();
            paint();
          },
        }),
        active.length || search
          ? btn('Reset', {
              variant: 'ghost',
              size: 'sm',
              onClick: () => {
                active = [];
                search = '';
                paintControls();
                paint();
              },
            })
          : null
      )
    );
  }

  paintControls();
  paint();

  return h(
    'div.page',
    pageHead(
      {
        eyebrow: 'Database',
        title: 'Bosses & events',
        lede: 'Every boss and major event, with the gear tier you should be at when you fight it.',
      },

/* ===== src/components/loadout.js ===== */
/**
 * Class loadout renderer.
 * Consumes a class build (data/class-builds.js) and paints the slot layout.
 */


function slot(label, nodes, { hint = null } = {}) {
  if (!nodes || !nodes.length) return null;
  return h(
    'div.slot',
    h('span.slot__label', label),
    hint ? h('p.tiny.dim', { style: { margin: '-2px 0 2px' } }, hint) : null,
    h('div.slot__items', ...nodes)
  );
}

/**
 * @param {object} build   class build entry
 * @param {object} options { cls, highlight: string[] }
 */
function loadoutView(build, { cls = 'ranger', highlight = [] } = {}) {
  if (!build) {
    return emptyState({
      title: 'No loadout for this stage yet',
      body: 'Pick a class in World Settings to see specific recommendations.',
    });
  }

  const classInfo = CLASS_MAP[cls] || CLASS_MAP.ranger;
  const highlightItems = resolveItems(highlight).filter(
    (item) => item.cls === cls || item.cls === 'universal'
  );

  const best = resolveItems(build.weapon);
  const alts = resolveItems(build.alt || []);
  const armor = resolveItems(build.armor || []);
  const accessories = resolveItems(build.accessories || []);
  const ammo = resolveItems(build.ammo || []);
  const potions = resolveItems(build.potions || []);

  return h(
    'div.loadout',
    { style: { '--accent': classInfo.accent } },

    build.note
      ? callout({ icon: classInfo.icon, title: `${classInfo.name} tip`, body: build.note, tone: 'info' })
      : null,

    highlightItems.length
      ? slot(
          'Best for this fight',
          highlightItems.map((item) => itemCard(item, { tag: 'best' })),
          { hint: 'Specifically strong against this boss.' }
        )
      : null,

    slot('Weapon', best.map((item) => itemCard(item, { tag: 'best' }))),
    slot('Alternatives', alts.map((item) => itemCard(item, { tag: 'alt' }))),
    slot('Armor', armor.map((item, i) => itemCard(item, { tag: i === 0 ? 'best' : 'alt' }))),
    slot('Accessories', accessories.map((item) => itemCard(item)), {
      hint: 'In priority order. Reforge to Warding for survival or Menacing for damage.',
    }),
    slot('Ammunition', ammo.map((item, i) => itemCard(item, { tag: i === 0 ? 'best' : 'alt' }))),
    slot('Potions', potions.map((item) => itemCard(item))),

    build.upgrades?.length
      ? h(
          'div.slot',
          h('span.slot__label', 'Optional upgrades'),
          panel({ variant: 'deep' }, bullets(build.upgrades, { variant: 'check' }))
        )
      : null
  );
}

/** One-line summary of a build, used in the class timeline header. */
function buildSummary(build) {
  const weapon = getItem(build?.weapon?.[0]);
  const armor = getItem(build?.armor?.[0]);
  if (!weapon && !armor) return null;
  return h(
    'p.small.muted',
    { style: { margin: 0 } },
    weapon ? h('b', weapon.name) : null,
    weapon && armor ? ' · ' : null,
    armor ? armor.name : null
  );
}

/**
 * Arena diagram + guidance.
 */


const STATION_MAP = Object.fromEntries(BUFF_STATIONS.map((s) => [s.id, s]));

function propRow(propIds) {
  return h(
    'div.arena__props',
    propIds.map((id) => {
      const station = STATION_MAP[id];
      if (!station) return null;
      return h(
        'span',
        { title: `${station.name} — ${station.effect}`, style: { textAlign: 'center' } },
        sprite(station.sprite, { size: 26, palette: tint(station.tint), alt: station.name })
      );
    })
  );
}

/** The pixel arena diagram. */
function arenaDiagram(arena) {
  return h(
    'div.arena',
    { role: 'img', 'aria-label': `${arena.name} layout diagram` },
    arena.rows.map((row) => {
      if (row.type === 'gap') return h('div.arena__gap');
      if (row.type === 'player') {
        return h(
          'div.arena__row',
          h('span.arena__tag', ''),
          h('div.arena__player', row.label || 'YOU')
        );
      }
      if (row.type === 'props') {
        return h('div.arena__row', h('span.arena__tag', row.label || 'BUFFS'), propRow(arena.props || []));
      }
      if (row.type === 'ground') {
        return h('div.arena__row', h('span.arena__tag', row.label || 'GROUND'), h('div.arena__ground'));
      }
      return h(
        'div.arena__row',
        h('span.arena__tag', row.label || 'PLATFORM'),
        h('div.arena__platform', { class: row.long ? 'arena__platform--long' : null })
      );
    })
  );
}

/** Full arena block: diagram + size + guidelines + buff stations. */
function arenaSection(arena) {
  return h(
    'div.stack',
    h(
      'div.row.row--wrap',
      badge(arena.name, { variant: 'gold' }),
      h('span.small.muted', arena.size)
    ),
    h('p.small.muted', { style: { margin: 0 } }, arena.summary),
    arenaDiagram(arena),
    panel({ variant: 'deep' }, bullets(arena.guidelines)),
    h(
      'div.grid.grid--3',
      (arena.props || []).map((id) => {
        const station = STATION_MAP[id];
        if (!station) return null;
        return h(
          'div.itemcard',
          sprite(station.sprite, { size: 30, palette: tint(station.tint), alt: '' }),
          h(
            'span.itemcard__info',
            h('span.itemcard__name', station.name),
            h('span.tiny.success', { style: { display: 'block' } }, station.effect),
            h('span.tiny.dim', { style: { display: 'block', marginTop: '2px' } }, station.note)
          )
        );
      })
    )
  );
}

      'div.page',
      panel(

        emptyState({
          title: 'Boss not found',

          `${boss.tier === 'hardmode' ? 'HARDMODE' : 'PRE-HARDMODE'} • ${boss.title.toUpperCase()}`

        h(

          status === 'done' ? badge('Defeated', { variant: 'success' }) : null,
          locked ? badge('Locked', { variant: 'danger' }) : null,
          boss.optional ? badge('Optional', { variant: 'optional' }) : badge('Main progression', { variant: 'gold' }),
          boss.kind === 'event' ? badge('Event', {}) : null,
          badge(stage?.label || boss.stage, {})
        ),
        h(
          'div.row.row--wrap',

/* ===== src/pages/items.js ===== */
/**
 * Item database (spec §18) with type / class / progression filters.
 */


function itemsPage({ query } = {}) {
  const state = getState();

  let search = query?.get('q')?.replace(/\+/g, ' ') || '';
  let types = [];
  let classes = [];
  let buckets = [];
  let hideOtherEvil = true;

  // Deep link: #/items?item=terra_blade opens the modal directly.
  const deepItem = query?.get('item');
  if (deepItem) setTimeout(() => openItemModal(deepItem), 30);

  const controls = h('div');
  const results = h('div');

  function paint() {
    const list = sortByProgression(
      filterItems({
        types,
        classes,
        buckets,
        query: search,
        evil: hideOtherEvil ? state.world.evil : null,
      })
    );

    if (!list.length) {
      mount(
        results,
        panel(
          {},
          emptyState({
            title: 'Nothing found',
            body: 'No adventurer has discovered anything matching that search.',
            art: sprite('unknown', { size: 56 }),
            action: btn('Clear filters', { variant: 'ghost', onClick: reset }),
          })
        )
      );
      return;
    }

    mount(
      results,
      h('p.tiny.dim', { style: { margin: '0 0 12px' } }, `${list.length} of ${ITEMS.length} items`),
      h('div.grid.grid--3', list.map((item) => itemGridCard(item)))
    );
  }

  function reset() {
    types = [];
    classes = [];
    buckets = [];
    search = '';
    paintControls();
    paint();
  }

  function toggler(arrayName) {
    return (id) => {
      const map = { types, classes, buckets };
      const next = map[arrayName].includes(id)
        ? map[arrayName].filter((x) => x !== id)
        : [...map[arrayName], id];
      if (arrayName === 'types') types = next;
      if (arrayName === 'classes') classes = next;
      if (arrayName === 'buckets') buckets = next;
      paintControls();
      paint();
    };
  }

  function paintControls() {
    mount(
      controls,
      h(
        'div.filterbar',
        searchInput({
          placeholder: 'Search items…',
          value: search,
          focusKey: 'item-search',
          onInput: (value) => {
            search = value;
            paint();
          },
        }),
        types.length || classes.length || buckets.length || search
          ? btn('Reset', { variant: 'ghost', size: 'sm', onClick: reset })
          : null
      ),
      panel(
        { variant: 'deep' },
        h(
          'div.stack',
          { style: { gap: '10px' } },
          chipGroup({ label: 'Type', options: ITEM_TYPE_FILTERS, selected: types, onToggle: toggler('types') }),
          chipGroup({ label: 'Class', options: ITEM_CLASS_FILTERS, selected: classes, onToggle: toggler('classes') }),
          chipGroup({ label: 'Progression', options: PROGRESSION_FILTERS, selected: buckets, onToggle: toggler('buckets') }),
          h(
            'div.row.row--wrap',
            h('span.filtergroup__label', 'World evil'),
            h(
              'button.chip',
              {
                type: 'button',
                class: hideOtherEvil ? 'is-active' : null,
                'aria-pressed': hideOtherEvil ? 'true' : 'false',
                onclick: () => {
                  hideOtherEvil = !hideOtherEvil;
                  paintControls();
                  paint();
                },
              },
              hideOtherEvil ? `Hiding non-${state.world.evil} items` : 'Showing all items'
            )
          )
        )
      )
    );
  }

  paintControls();
  paint();

  return h(
    'div.page',
    pageHead(
      {
        eyebrow: 'Database',
        title: 'Items',
        lede: 'Weapons, armor, accessories, ammo, potions and materials — filtered to what actually matters at each stage.',
      },
      badge(`${ITEMS.length} entries`, {}),
      btn('Accessory chains', { variant: 'ghost', href: '#/class-builds', icon: '🔗' })
    ),
    controls,
    h('div', { style: { marginTop: '16px' } }, results)
  );
}

            isPast && !isActive ? badge('Past stage', {}) : null,
            badge(`${done}/${entries.length}`, { variant: done === entries.length ? 'success' : '' })
          ),
          h('p.small.muted', { style: { marginTop: 0 } }, section.intro),
          checklist(entries, { metaSuffix: 'DONE' })
        );
      })
    )
  );
}

function settingRow(title, body, control) {
  return h(
    'div.settingrow',
    h(
      'div.settingrow__info',
      h('b.small', title),
      h('p.tiny.muted', { style: { margin: '2px 0 0' } }, body)
    ),
    h('div', control)
  );
}

function toggle(value, onChange) {
  const wrap = h('button.toggle', {
    type: 'button',
    class: value ? 'is-on' : null,
    'aria-pressed': value ? 'true' : 'false',
    onclick: () => onChange(!value),
  });
  mount(
    wrap,
    h('span.toggle__track', h('span.toggle__knob')),
    h('span.toggle__text', value ? 'On' : 'Off')
  );
  return wrap;
}

function confirmDialog({ title, body, confirmLabel, onConfirm, danger = false }) {
  let close = () => {};
  close = openModal({
    title,
    body: h('p.small.muted', { style: { margin: 0 } }, body),
    footer: h(
      'div.row.row--end',
      btn('Cancel', { variant: 'ghost', onClick: () => close() }),
      btn(confirmLabel, {
        variant: danger ? 'danger' : 'primary',
        onClick: () => {
          close();
          onConfirm();
        },
      })
    ),
  });
}

/* ===== src/main.js ===== */
/**
 * TerraGuide entry point.
 *
 * Wires the shell, the router and the store together. No build step, no
 * dependencies — just ES modules.
 */



function boot() {
  applyDisplayPreferences();
  renderSky();

  const outlet = buildShell(document.getElementById('app'));

  defineRoutes(
    [
      { path: '/', render: homePage },
      { path: '/setup', render: setupPage, reactive: false },
      { path: '/dashboard', render: dashboardPage },
      { path: '/progression', render: progressionPage },
      { path: '/bosses', render: bossesPage },
      { path: '/bosses/:id', render: bossDetailPage },
      { path: '/class-builds', render: classBuildsPage },
      { path: '/items', render: itemsPage },
      { path: '/potions', render: potionsPage },
      { path: '/npcs', render: npcsPage },
      { path: '/resources', render: resourcesPage },
      { path: '/world-prep', render: worldPrepPage },
      { path: '/beginner', render: beginnerPage },
      { path: '/settings', render: settingsPage },
    ],
    {
      notFound: notFoundPage,
      afterNavigate: ({ path }) => setActiveNav(path),
    }
  );

  startRouter(outlet);

  // Any state mutation re-renders the current page (scroll + focus preserved).
  subscribe((_state, reason) => {
    if (reason === 'display') renderSky();
    refresh();
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  boot();
}

})();
</script>
