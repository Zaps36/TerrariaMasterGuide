/* ==========================================================================
   TerraGuide — base: design tokens, reset, typography, pixel sky
   ========================================================================== */

:root {
  /* --- surfaces ------------------------------------------------------- */
  --bg: #080d18;
  --bg-2: #101827;
  --panel: #172234;
  --panel-light: #202e42;
  --panel-deep: #0d1522;
  --border: #4a5668;
  --border-soft: #2b3547;
  --ink: #05070d;

  /* --- text ----------------------------------------------------------- */
  --text: #f4f1de;
  --muted: #aeb7c5;
  --dim: #79839a;

  /* --- semantic ------------------------------------------------------- */
  --gold: #f2c14e;
  --gold-deep: #b98a26;
  --success: #72d572;
  --warning: #f2b84b;
  --danger: #e76f51;

  /* --- class accents -------------------------------------------------- */
  --melee: #e58b7b;
  --ranger: #6cb4ee;
  --mage: #9b7ede;
  --summoner: #d78bff;
  --universal: #f2c14e;

  /* --- world accents -------------------------------------------------- */
  --corruption: #9b7ede;
  --crimson: #e05b5b;

  /* --- rarity (Terraria-inspired tiers) ------------------------------- */
  --rarity-gray: #9d9d9d;
  --rarity-white: #f4f1de;
  --rarity-blue: #6c9bea;
  --rarity-green: #63d16a;
  --rarity-orange: #e8974b;
  --rarity-red: #e05b5b;
  --rarity-pink: #e878c8;
  --rarity-purple: #b071e8;
  --rarity-lime: #a8e04b;
  --rarity-yellow: #f2d24e;
  --rarity-cyan: #4fd6d6;
  --rarity-rainbow: #f28ec4;

  /* --- typography ----------------------------------------------------- */
  --font-display: 'Press Start 2P', 'Silkscreen', ui-monospace, 'DejaVu Sans Mono', monospace;
  --font-pixel: 'Silkscreen', 'Press Start 2P', ui-monospace, 'DejaVu Sans Mono', monospace;
  --font-body: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* --- metrics -------------------------------------------------------- */
  --sidebar-w: 244px;
  --topbar-h: 66px;
  --bottomnav-h: 62px;
  --px: 4px; /* the pixel unit everything snaps to */
  --gap: 18px;
  --radius: 0px;
  --page-max: 1280px;

  /* --- notched pixel corner path -------------------------------------- */
  --notch: 8px;
}

/* ==========================================================================
   LIGHT THEME — "day in a Terraria forest"
   Bright sky, warm wood + parchment panels, deep-green ink. Only the tokens
   change; every component reads from these variables, so the whole app
   re-themes from this one block.
   ========================================================================== */

:root[data-theme='light'] {
  /* surfaces: parchment + oak plank */
  --bg: #cfe7f2;
  --bg-2: #e7dcc0;
  --panel: #efe6cf;
  --panel-light: #f7f1df;
  --panel-deep: #e2d5b6;
  --border: #a9895a;
  --border-soft: #cbb488;
  --ink: #5a4326; /* wood-brown outline instead of near-black */

  /* text: deep forest ink */
  --text: #33291a;
  --muted: #6a5a41;
  --dim: #8a7b60;

  /* semantic — deepened so they read on light surfaces */
  --gold: #c98a1e;
  --gold-deep: #8a5c10;
  --success: #3f9b47;
  --warning: #d18a1c;
  --danger: #c94a34;

  /* class accents (darker variants for contrast on parchment) */
  --melee: #c85a45;
  --ranger: #2f7fc4;
  --mage: #7a53c0;
  --summoner: #a94fd0;
  --universal: #c98a1e;

  --corruption: #7a53c0;
  --crimson: #c94a34;

  /* rarity tiers, contrast-tuned for a bright background */
  --rarity-gray: #6f6f6f;
  --rarity-white: #4a4433;
  --rarity-blue: #2f6fc4;
  --rarity-green: #2f8f37;
  --rarity-orange: #c07214;
  --rarity-red: #c23a2f;
  --rarity-pink: #c74a9e;
  --rarity-purple: #8a45c0;
  --rarity-lime: #5f8f14;
  --rarity-yellow: #b8901c;
  --rarity-cyan: #1f9a9a;
  --rarity-rainbow: #c24a8f;
}

/* --------------------------------------------------------------- reset --- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

html.reduced-motion,
html.reduced-motion * {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
  scroll-behavior: auto !important;
}

@media (prefers-reduced-motion: reduce) {
  html,
  html * {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

img,
svg,
canvas {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

a {
  color: var(--gold);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

p {
  margin: 0 0 0.85em;
}

p:last-child {
  margin-bottom: 0;
}

hr {
  border: 0;
  border-top: 2px dashed var(--border-soft);
  margin: 18px 0;
}

/* ------------------------------------------------------- focus & a11y --- */

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 999;
  background: var(--gold);
  color: var(--ink);
  padding: 10px 16px;
  font-family: var(--font-pixel);
}

.skip-link:focus {
  left: 8px;
  top: 8px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------------------------------------------------------- typography --- */

h1,
h2,
h3,
h4,
h5 {
  margin: 0 0 0.5em;
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text);
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.55);
}

h1 {
  font-size: clamp(1.35rem, 3.4vw, 2.15rem);
}
h2 {
  font-size: clamp(1.05rem, 2.2vw, 1.35rem);
}
h3 {
  font-size: clamp(0.9rem, 1.7vw, 1.05rem);
}
h4 {
  font-size: 0.85rem;
  font-family: var(--font-pixel);
  letter-spacing: 0.06em;
}
h5 {
  font-size: 0.78rem;
  font-family: var(--font-pixel);
  letter-spacing: 0.08em;
  color: var(--muted);
}

.display {
  font-family: var(--font-display);
  text-transform: uppercase;
}

.pixel-text {
  font-family: var(--font-pixel);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.eyebrow {
  font-family: var(--font-pixel);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 6px;
}

.muted {
  color: var(--muted);
}
.dim {
  color: var(--dim);
}
.gold {
  color: var(--gold);
}
.success {
  color: var(--success);
}
.danger {
  color: var(--danger);
}
.warning {
  color: var(--warning);
}

.lede {
  font-size: 1.02rem;
  color: var(--muted);
  max-width: 62ch;
}

.small {
  font-size: 0.82rem;
}
.tiny {
  font-size: 0.72rem;
}

.nowrap {
  white-space: nowrap;
}

.mono {
  font-family: var(--font-pixel);
}

/* ------------------------------------------------------------ helpers --- */

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.row--wrap {
  flex-wrap: wrap;
}
.row--between {
  justify-content: space-between;
}
.row--end {
  justify-content: flex-end;
}
.row--top {
  align-items: flex-start;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.grow {
  flex: 1 1 auto;
  min-width: 0;
}
.stack > * + * {
  margin-top: var(--gap);
}
.center {
  text-align: center;
}

.grid {
  display: grid;
  gap: var(--gap);
}
.grid--2 {
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}
.grid--3 {
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
}
.grid--4 {
  grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
}
.grid--wide {
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
}

.sprite {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  flex: none;
}

/* Compact display mode (Settings → Display) */
html.compact {
  --gap: 12px;
  font-size: 14px;
}
html.compact .page {
  padding-top: 14px;
}

/* ========================================================================
   PIXEL NIGHT SKY
   ======================================================================== */

.tg-sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background:
    radial-gradient(1100px 620px at 78% -8%, rgba(90, 74, 150, 0.42), transparent 65%),
    radial-gradient(900px 520px at 10% 4%, rgba(30, 66, 110, 0.4), transparent 62%),
    linear-gradient(180deg, #0a1020 0%, #0a1224 42%, #0b1526 68%, #080d18 100%);
}

/* ---- day-in-forest sky ---- */
:root[data-theme='light'] .tg-sky {
  background:
    radial-gradient(680px 420px at 82% -6%, rgba(255, 236, 150, 0.85), transparent 60%),
    radial-gradient(900px 520px at 12% 2%, rgba(180, 224, 255, 0.6), transparent 62%),
    linear-gradient(180deg, #8fd0f0 0%, #a9dcf2 34%, #c9ead0 66%, #d8e6b0 100%);
}

/* stars only make sense at night */
:root[data-theme='light'] .tg-sky__stars,
:root[data-theme='light'] .tg-sky__moon {
  display: none;
}

/* the "moon" node becomes a warm sun in light mode */
:root[data-theme='light'] .tg-sky__sun {
  display: block;
}

.tg-sky__sun {
  display: none;
  position: absolute;
  top: 40px;
  right: 8vw;
  width: 84px;
  height: 84px;
  background: #ffe27a;
  box-shadow:
    0 0 0 8px rgba(255, 226, 122, 0.35),
    0 0 0 18px rgba(255, 226, 122, 0.18),
    0 0 80px 30px rgba(255, 226, 122, 0.5);
  clip-path: polygon(
    25% 0, 75% 0, 75% 8%, 92% 8%, 92% 25%, 100% 25%, 100% 75%, 92% 75%,
    92% 92%, 75% 92%, 75% 100%, 25% 100%, 25% 92%, 8% 92%, 8% 75%, 0 75%,
    0 25%, 8% 25%, 8% 8%, 25% 8%
  );
}

/* daytime clouds: solid, fluffy, white */
:root[data-theme='light'] .tg-sky__cloud {
  height: 12px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow:
    12px -7px 0 0 rgba(255, 255, 255, 0.85),
    -14px -5px 0 0 rgba(255, 255, 255, 0.8),
    26px 0 0 0 rgba(255, 255, 255, 0.82);
}

/* rolling green hills instead of dark mountains */
:root[data-theme='light'] .tg-sky__ridge--far {
  background: #7db85a;
  opacity: 0.75;
}
:root[data-theme='light'] .tg-sky__ridge--near {
  background: #5fa03f;
}

/* lush green tree canopies */
:root[data-theme='light'] .tg-sky__tree {
  background: #3f7a2c;
  opacity: 0.92;
}

:root[data-theme='light'] .tg-sky__ground {
  background: #4a6b28;
  border-top-color: #6f9a3c;
}

/* daytime motes read as drifting pollen / leaves */
:root[data-theme='light'] .tg-sky__mote {
  opacity: 0.5;
}

.tg-sky__stars,
.tg-sky__particles {
  position: absolute;
  inset: 0;
}

.tg-sky__star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #f4f1de;
  opacity: 0.75;
  animation: twinkle 4s steps(2, end) infinite;
}

.tg-sky__star--big {
  width: 3px;
  height: 3px;
  box-shadow: 0 0 6px rgba(244, 241, 222, 0.7);
}

@keyframes twinkle {
  0%,
  100% {
    opacity: 0.2;
  }
  50% {
    opacity: 0.95;
  }
}

.tg-sky__moon {
  position: absolute;
  top: 34px;
  right: 6vw;
  width: 78px;
  height: 78px;
  opacity: 0.5;
  background: #e8e2c4;
  box-shadow:
    0 0 0 6px rgba(246, 241, 216, 0.07),
    0 0 0 14px rgba(246, 241, 216, 0.04),
    0 0 60px 20px rgba(246, 241, 216, 0.12);
  clip-path: polygon(
    25% 0,
    75% 0,
    75% 8%,
    92% 8%,
    92% 25%,
    100% 25%,
    100% 75%,
    92% 75%,
    92% 92%,
    75% 92%,
    75% 100%,
    25% 100%,
    25% 92%,
    8% 92%,
    8% 75%,
    0 75%,
    0 25%,
    8% 25%,
    8% 8%,
    25% 8%

}

.tg-sky__moon::before,
.tg-sky__moon::after {
  content: '';
  position: absolute;
  background: rgba(198, 192, 164, 0.55);
}

.tg-sky__moon::before {

}

.tg-sky__moon::after {
  width: 12px;
  height: 12px;
  bottom: 22px;
  right: 26px;
}

.tg-sky__cloud {
  position: absolute;
  height: 10px;
  background: rgba(150, 168, 205, 0.07);
  box-shadow:
    12px -6px 0 0 rgba(150, 168, 205, 0.06),
    -14px -4px 0 0 rgba(150, 168, 205, 0.05),
    26px 0 0 0 rgba(150, 168, 205, 0.055);
  animation: drift 90s linear infinite;
}

@keyframes drift {
  from {
    transform: translateX(-12vw);
  }

    transform: translateX(112vw);

/* stepped, pixel-ish mountain + forest silhouettes */
.tg-sky__ridge {
  position: absolute;
  left: -2%;
  width: 104%;

}

.tg-sky__ridge--far {
  height: 30vh;
  background: #131c2e;
  clip-path: polygon(
    0 62%, 5% 62%, 5% 54%, 10% 54%, 10% 44%, 14% 44%, 14% 34%, 18% 34%, 18% 26%,
    22% 26%, 22% 36%, 27% 36%, 27% 46%, 32% 46%, 32% 40%, 36% 40%, 36% 30%,
    41% 30%, 41% 20%, 45% 20%, 45% 30%, 50% 30%, 50% 42%, 55% 42%, 55% 52%,
    60% 52%, 60% 40%, 65% 40%, 65% 28%, 70% 28%, 70% 38%, 75% 38%, 75% 48%,
    80% 48%, 80% 38%, 85% 38%, 85% 48%, 90% 48%, 90% 58%, 95% 58%, 95% 64%,
    100% 64%, 100% 100%, 0 100%
  );
  opacity: 0.85;
}

.tg-sky__ridge--near {
  height: 20vh;
  background: #0e1522;
  clip-path: polygon(
    0 70%, 6% 70%, 6% 58%, 12% 58%, 12% 48%, 17% 48%, 17% 58%, 23% 58%, 23% 66%,
    29% 66%, 29% 54%, 35% 54%, 35% 44%, 41% 44%, 41% 56%, 47% 56%, 47% 68%,
    53% 68%, 53% 56%, 59% 56%, 59% 46%, 65% 46%, 65% 58%, 71% 58%, 71% 68%,
    77% 68%, 77% 56%, 83% 56%, 83% 66%, 89% 66%, 89% 74%, 95% 74%, 95% 66%,
    100% 66%, 100% 100%, 0 100%
  );

.tg-sky__trees {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 92px;
  display: flex;
  align-items: flex-end;
  gap: 3vw;

.tg-sky__tree {

    58% 100%
  );

.tg-sky__ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

/* floating pixel motes */
.tg-sky__mote {
  position: absolute;

/* ==========================================================================
   TerraGuide — layout: app shell, sidebar, topbar, mobile navigation
   ========================================================================== */

.tg-app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

/* --------------------------------------------------------------- shell --- */

.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.shell__main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.page {
  width: 100%;
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 22px clamp(14px, 2.6vw, 34px) 80px;
  min-width: 0;
}

/* ------------------------------------------------------------- sidebar --- */

.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #131d2d 0%, #101827 100%);
  border-right: 4px solid var(--ink);
  box-shadow: inset -4px 0 0 rgba(74, 86, 104, 0.35);
  overflow: hidden;
}

.sidebar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 14px 14px;
  border-bottom: 4px solid var(--ink);
  background: linear-gradient(180deg, rgba(242, 193, 78, 0.09), transparent);
}

.sidebar__logo {
  width: 34px;
  height: 34px;
  flex: none;
  background: var(--gold);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 15px;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 0 var(--gold-deep);
  clip-path: polygon(
    18% 0, 82% 0, 82% 18%, 100% 18%, 100% 82%, 82% 82%, 82% 100%, 18% 100%,
    18% 82%, 0 82%, 0 18%, 18% 18%
  );
}

.sidebar__title {
  font-family: var(--font-display);
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  line-height: 1.2;
}

.sidebar__sub {
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
}

.sidebar__scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 12px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.sidebar__scroll::-webkit-scrollbar {
  width: 8px;
}
.sidebar__scroll::-webkit-scrollbar-thumb {
  background: var(--border);
}

.sidebar__label {
  font-family: var(--font-pixel);
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  color: var(--dim);
  text-transform: uppercase;
  padding: 12px 8px 6px;
}

.navlink {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  margin-bottom: 2px;
  color: var(--muted);
  font-family: var(--font-pixel);
  font-size: 0.82rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-left: 4px solid transparent;
  transition: background 0.12s steps(2), color 0.12s, border-color 0.12s;
  text-align: left;
}

.navlink:hover {
  background: var(--panel-light);
  color: var(--text);
  text-decoration: none;
}

.navlink.is-active {
  background: linear-gradient(90deg, rgba(242, 193, 78, 0.16), transparent);
  border-left-color: var(--gold);
  color: var(--gold);
}

.navlink__icon {
  width: 20px;
  text-align: center;
  font-size: 1rem;
  flex: none;
}

.navlink__badge {
  margin-left: auto;
  font-size: 0.62rem;
  padding: 1px 5px;
  background: var(--panel-light);
  color: var(--muted);
  border: 2px solid var(--border-soft);
}

.sidebar__footer {
  border-top: 4px solid var(--ink);
  padding: 10px;
  background: var(--panel-deep);
}

.sidebar__world {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 10px 10px;
  font-family: var(--font-pixel);
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  color: var(--muted);

}

.card__corner {

}

  right: 6px;

  height: 22px;

  color: var(--ink);

/* ------------------------------------------------------------- callout --- */

.callout {
  display: flex;
  gap: 12px;
  padding: 14px;

    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px #8f4531;
}

.callout--info {
  background: linear-gradient(180deg, rgba(108, 180, 238, 0.14), rgba(23, 34, 52, 0.9));

    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px #3a6a94;

.callout--optional {
  background: linear-gradient(180deg, rgba(74, 168, 138, 0.14), rgba(23, 34, 52, 0.9));

    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px #2f6b58;

.callout__icon {
  font-size: 1.4rem;
  line-height: 1.1;

}

.callout__title {

  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 4px;
  color: var(--text);
}

/* --------------------------------------------------------------- modal --- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(4, 7, 13, 0.8);
  display: grid;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
  animation: fade-in 0.14s steps(3);
}

.modal {
  position: relative;
  width: min(720px, 100%);
  max-height: min(88vh, 900px);
  overflow-y: auto;
  padding: 0;
  background: linear-gradient(180deg, #1d2b3f 0, var(--panel) 18%, var(--panel) 100%);

    inset 0 0 0 3px var(--ink),

  scrollbar-color: var(--border) transparent;
}

@keyframes modal-in {

    transform: translateY(14px) scale(0.97);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

.modal__head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 16px 12px;

}

.modal__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 0.95rem;
  line-height: 1.4;
}

.modal__close {

  flex: none;
  width: 34px;
  height: 34px;

  place-items: center;
  font-family: var(--font-pixel);
  font-size: 0.9rem;

  color: var(--text);

}

.modal__close:hover {
  background: var(--danger);
  color: var(--ink);
}

.modal__body {
  padding: 16px;
  display: grid;
  gap: 14px;
}

/* --------------------------------------------------------------- toast --- */

.toast-root {
  position: fixed;
  z-index: 200;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  pointer-events: none;
  width: min(420px, calc(100vw - 24px));
}

@media (max-width: 900px) {

    bottom: calc(var(--bottomnav-h) + 14px);
  }
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: linear-gradient(180deg, #253550 0, #16202f 100%);

  font-size: 0.76rem;
  letter-spacing: 0.06em;

    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--gold-deep);

}

.toast--success {

    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px #3c8a3c;
}

.toast.is-out {
  animation: toast-out 0.24s steps(3) forwards;
}

@keyframes toast-in {
  from {
    transform: translateY(16px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

@keyframes toast-out {
  to {
    transform: translateY(10px);
    opacity: 0;
  }
}

/* ---------------------------------------------------------- empty state --- */

.empty {
  display: grid;
  justify-items: center;
  gap: 12px;
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}

.empty__art {

}

.empty__title {

  font-size: 0.9rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text);
  margin: 0;
}

.empty p {
  max-width: 46ch;
}

/* ----------------------------------------------------- search & filters --- */

.search {
  position: relative;
  flex: 1 1 200px;
  max-width: 420px;
}

.search__input {

  min-height: 42px;
  padding: 10px 12px 10px 34px;

    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--border-soft);
}

.search__input::placeholder {
  color: var(--dim);

}

.search__input:focus {

}

.search__icon {

  pointer-events: none;
  opacity: 0.7;
}

.search__results {

.search__group-label {

  white-space: nowrap;
}

  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;

}

}

.filtergroup__label {

  margin-right: 2px;
}

}

.chip.is-active {
  color: var(--ink);
  background: var(--gold);
  box-shadow: inset 0 0 0 2px var(--ink);
}

/* ----------------------------------------------------------- stat grid --- */

.statgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 2px;
  background: var(--border-soft);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

.stat {
  padding: 10px 12px;
  background: var(--panel-deep);
  display: grid;
  gap: 3px;
}

.stat__label {
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
}

.stat__value {
  font-family: var(--font-display);
  font-size: 0.86rem;
  color: var(--text);
}

.stat__value--sm {
  font-size: 0.7rem;
}

/* ------------------------------------------------------------ keyvalue --- */

.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 0.88rem;
}

.kv dt {
  font-family: var(--font-pixel);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  align-self: center;
}

.kv dd {
  margin: 0;
  color: var(--text);
}

/* ----------------------------------------------------------- bullet list --- */

.bullets {
  display: grid;
  gap: 6px;
}

.bullets li {
  display: flex;
  gap: 8px;
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.5;
}

.bullets li::before {
  content: '▪';
  color: var(--gold);
  flex: none;
  line-height: 1.4;
}

.bullets--check li::before {
  content: '✓';
  color: var(--success);
}

.bullets--warn li::before {
  content: '!';
  color: var(--danger);
  font-family: var(--font-pixel);
}

/* --------------------------------------------------------- sparkle fx --- */

.sparkle {
  position: fixed;
  z-index: 300;
  width: 5px;
  height: 5px;
  pointer-events: none;
  background: var(--gold);
  animation: sparkle-fly 0.6s steps(6) forwards;
}

@keyframes sparkle-fly {
  from {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  to {
    transform: translate(var(--dx, 0), var(--dy, -30px)) scale(0.2);
    opacity: 0;
  }
}

/* --------------------------------------------------------- scroll area --- */

.scroll-x {
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  padding-bottom: 6px;
}

.scroll-x::-webkit-scrollbar {
  height: 10px;
}
.scroll-x::-webkit-scrollbar-track {
  background: var(--panel-deep);
}
.scroll-x::-webkit-scrollbar-thumb {
  background: var(--border);

  color: var(--ink);
  font-size: 0.82rem;
  box-shadow: inset 0 0 0 2px var(--ink);
}

.optioncard__top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.optioncard__icon {
  font-size: 1.5rem;
  line-height: 1;
}

.optioncard__name {
  font-family: var(--font-display);
  font-size: 0.8rem;
  text-transform: uppercase;
}

.optioncard__desc {
  font-size: 0.86rem;
  color: var(--muted);
  margin: 0;
}

.optioncard__ribbon {
  position: absolute;
  top: -3px;
  left: 12px;
  padding: 2px 8px 3px;
  background: var(--gold);
  color: var(--ink);
  font-family: var(--font-pixel);
  font-size: 0.56rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.setup__nav {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 4px solid var(--border-soft);
}

/* progress-stage list in setup step 4 */
.stagepicker {
  display: grid;
  gap: 4px;
}

.stagepicker__item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  text-align: left;
  color: var(--muted);
  background: rgba(13, 21, 34, 0.5);
  box-shadow: inset 0 0 0 2px transparent;
  min-height: 46px;
}

.stagepicker__item:hover {
  background: var(--panel-light);
  color: var(--text);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

.stagepicker__item.is-selected {
  color: var(--gold);
  background: linear-gradient(90deg, rgba(242, 193, 78, 0.16), transparent);
  box-shadow: inset 0 0 0 2px var(--gold-deep);
}

.stagepicker__num {
  font-family: var(--font-pixel);
  font-size: 0.64rem;
  color: var(--dim);
  width: 22px;
  flex: none;
}

/* =============================================================== DASHBOARD */

.dash {
  display: grid;
  gap: var(--gap);
}

.dash__hero {
  display: grid;
  gap: 16px;
  padding: clamp(16px, 2.4vw, 24px);
  background:
    radial-gradient(520px 200px at 88% 0%, rgba(108, 180, 238, 0.12), transparent 70%),
    linear-gradient(180deg, #1c2840 0, #141e30 60%, #111a2a 100%);
  clip-path: var(--clip-notch);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--gold-deep);
}

.dash__hero-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}

.dash__stagename {
  font-family: var(--font-display);
  font-size: clamp(1.1rem, 3.4vw, 1.85rem);
  margin: 4px 0 2px;
  color: var(--gold);
  text-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
}

.dash__cols {
  display: grid;
  gap: var(--gap);
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  align-items: start;
}

@media (max-width: 1024px) {
  .dash__cols {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* --- WHAT SHOULD I DO NEXT ------------------------------------------- */

.whatnext {
  position: relative;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(180deg, #24304a 0, #172234 40%, #16202f 100%);
  clip-path: var(--clip-notch);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--gold);
}

.whatnext__banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  background: linear-gradient(90deg, rgba(242, 193, 78, 0.28), rgba(242, 193, 78, 0.05));
  border-bottom: 3px solid var(--gold-deep);
  font-family: var(--font-display);
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text);
}

.whatnext__body {
  padding: 18px 16px 16px;
  display: grid;
  gap: 16px;
}

.whatnext__main {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.whatnext__portrait {
  position: relative;
  flex: none;
  padding: 12px;
  background:
    radial-gradient(60px 60px at 50% 40%, rgba(242, 193, 78, 0.18), transparent 70%),
    linear-gradient(180deg, #1f2c42 0, #131c2c 100%);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--gold-deep);
  clip-path: var(--clip-notch-sm);
  animation: node-pulse 2.4s steps(6) infinite;
}

.whatnext__info {
  flex: 1 1 260px;
  min-width: 0;
}

.whatnext__objective {
  font-family: var(--font-display);
  font-size: clamp(1rem, 2.8vw, 1.5rem);
  margin: 2px 0 8px;
  line-height: 1.3;
}

.whatnext__why {
  color: var(--muted);
  font-size: 0.92rem;
  margin: 0 0 12px;
}

.whatnext__prep {
  display: grid;
  gap: 8px;
  padding: 12px;
  background: rgba(8, 13, 24, 0.5);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

.whatnext__prep-title {
  font-family: var(--font-pixel);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
}

.preppills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.preppill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  font-size: 0.78rem;
  color: var(--muted);
  background: var(--panel-deep);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

/* ---- progress dashboard block --------------------------------------- */

.progressblock {
  display: grid;
  gap: 14px;
}

/* ================================================================ PROGRESSION */

.tree {
  display: grid;
  justify-items: center;
  gap: 0;
}

.tree__band {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: min(560px, 100%);
  margin: 10px 0;
  padding: 10px 14px;
  font-family: var(--font-display);
  font-size: 0.8rem;
  text-transform: uppercase;
  color: #ffd9a8;
  background: linear-gradient(90deg, rgba(231, 111, 81, 0.3), rgba(155, 126, 222, 0.22));
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px #8f4531;
  clip-path: var(--clip-notch-sm);
  text-align: center;
}

.tree__link {
  width: 6px;
  height: 22px;
  background: repeating-linear-gradient(180deg, var(--border) 0 6px, transparent 6px 12px);
}

.tree__link--done {
  background: repeating-linear-gradient(180deg, var(--success) 0 6px, transparent 6px 12px);
}

.node {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(560px, 100%);
  padding: 12px 14px;
  text-align: left;
  background: linear-gradient(180deg, var(--panel-light) 0, var(--panel) 32%);
  clip-path: var(--clip-notch);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--border-soft);
  transition: transform 0.1s steps(2), box-shadow 0.12s;
  color: inherit;
}

.node:hover {
  transform: translateX(3px);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--border);
  text-decoration: none;
}

.node__info {
  min-width: 0;
  flex: 1 1 auto;
}

.node__name {
  font-family: var(--font-display);
  font-size: 0.8rem;
  text-transform: uppercase;
  margin: 0 0 4px;
}

.node__meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.node__status {
  flex: none;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  font-family: var(--font-pixel);
  font-size: 0.8rem;
  color: var(--dim);
  background: var(--panel-deep);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

.node.is-done {
  opacity: 0.78;
}

.node.is-done .node__status {
  background: var(--success);
  color: var(--ink);
  box-shadow: inset 0 0 0 2px var(--ink);
}

.node.is-locked {
  filter: grayscale(0.65) brightness(0.6);
}

.node.is-available {
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--ranger);
}

.node.is-next {
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--gold);
  animation: node-pulse 2.2s steps(6) infinite;
}

@keyframes node-pulse {
  0%,
  100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.18);
  }
}

.node__flag {
  position: absolute;
  top: -3px;
  right: 12px;
  padding: 2px 8px 3px;
  background: var(--gold);
  color: var(--ink);
  font-family: var(--font-pixel);
  font-size: 0.54rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.node--optional {
  width: 100%;
}

/* ============================================================== BOSS DETAIL */

.bossdetail__hero {
  position: relative;
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  padding: clamp(16px, 3vw, 26px);
  background:
    radial-gradient(340px 200px at 18% 50%, rgba(242, 193, 78, 0.14), transparent 70%),
    linear-gradient(180deg, #1d2942 0, #131d2e 60%, #111a2a 100%);
  clip-path: var(--clip-notch);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--gold-deep);
  overflow: hidden;
}

.bossdetail__art {
  flex: none;
  padding: 14px;
  background:
    radial-gradient(90px 90px at 50% 45%, rgba(242, 193, 78, 0.14), transparent 72%),
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0 4px, transparent 4px 8px),
    linear-gradient(180deg, #22314a 0, #131c2c 100%);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--border-soft);
  clip-path: var(--clip-notch-sm);
}

.bossdetail__title {
  font-size: clamp(1.2rem, 4vw, 2.1rem);
  margin: 6px 0 6px;
}

.loadout {
  display: grid;
  gap: 12px;
}

.slot {
  display: grid;
  gap: 8px;
}

.slot__label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-pixel);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
}

.slot__label::after {
  content: '';
  flex: 1 1 auto;
  height: 3px;
  background: repeating-linear-gradient(90deg, var(--border-soft) 0 6px, transparent 6px 12px);
}

.slot__items {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}

/* ---- item card ------------------------------------------------------ */

.itemcard {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  text-align: left;
  background: linear-gradient(180deg, #1e2b40 0, #172234 40%);
  clip-path: var(--clip-notch-sm);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--border-soft);
  transition: transform 0.1s steps(2), box-shadow 0.12s;
  color: inherit;
  width: 100%;
  min-height: 62px;
}

.itemcard:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--gold-deep);
  text-decoration: none;
}

.itemcard__info {
  display: block;
  min-width: 0;
  flex: 1 1 auto;
  padding-right: 4px;
}



.itemcard__name {
  display: block; /* required so the ribbon padding actually constrains wrapping */
  font-family: var(--font-pixel);
  font-size: 0.84rem;
  letter-spacing: 0.02em;
  color: var(--text);
  line-height: 1.3;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}

.itemcard__sub {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 3px;
}

.itemcard--best {
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--gold);
}

.itemcard--alt {
  opacity: 0.92;
}

.itemcard {
  position: relative;
}

/* Lives inside the wrapping badge row, so it can never overlap the name. */
.itemcard__tag {
  font-family: var(--font-pixel);
  font-size: 0.54rem;
  letter-spacing: 0.08em;
  padding: 2px 5px;
  text-transform: uppercase;
  background: var(--gold);
  color: var(--ink);
  flex: none;
}

.itemcard__tag--alt {
  background: var(--border);
  color: var(--text);
}

.itemcard__tag--luxury {
  background: var(--mage);
  color: var(--ink);
}

/* ---- arena diagram -------------------------------------------------- */

.arena {
  display: grid;
  gap: 0;
  padding: 14px;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0 4px, transparent 4px 8px),
    linear-gradient(180deg, #101a2b 0, #0b1220 100%);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--border-soft);
  clip-path: var(--clip-notch-sm);
  overflow-x: auto;
}

.arena__row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 30px;
}

.arena__platform {
  flex: 1 1 auto;
  height: 8px;
  min-width: 120px;
  background:
    repeating-linear-gradient(90deg, #8a5a3b 0 10px, #5d3a25 10px 12px);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
}

.arena__platform--long {
  min-width: 320px;
}

.arena__gap {
  height: 26px;
  flex: none;
}

.arena__tag {
  font-family: var(--font-pixel);
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  white-space: nowrap;
  flex: none;
  width: 92px;
  text-align: right;
}

.arena__props {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex: 1 1 auto;
  min-width: 120px;
}

.arena__ground {
  flex: 1 1 auto;
  height: 12px;
  min-width: 120px;
  background:
    repeating-linear-gradient(90deg, #4a6b3a 0 6px, #3a5730 6px 10px);
  box-shadow: inset 0 3px 0 #5f8a49;
}

.arena__player {
  display: grid;
  place-items: center;
  flex: 1 1 auto;
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-transform: uppercase;
}

/* ---- chain / crafting trees ---------------------------------------- */

.chain {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: max-content;
  padding: 4px 0;
}

.chain__arrow {
  flex: none;
  font-family: var(--font-pixel);
  color: var(--gold);
  font-size: 0.9rem;
}

.chain__step {
  flex: none;
  width: 178px;
}

.craft {
  display: grid;
  grid-template-columns: minmax(150px, 200px) 26px minmax(150px, 220px);
  gap: 10px;
  align-items: center;
  min-width: max-content;
}

.craft__inputs {
  display: grid;
  gap: 6px;
}

.craft__brace {
  align-self: stretch;
  border-left: 4px solid var(--border);
  border-top: 4px solid var(--border);
  border-bottom: 4px solid var(--border);
  position: relative;
  margin: 8px 0;
}

.craft__brace::after {
  content: '▶';
  position: absolute;
  right: -12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold);
  font-size: 0.8rem;
}

/* =============================================================== CLASS BUILDS */

.stagejump {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 6px;
  scrollbar-width: none;
}

.stagejump::-webkit-scrollbar {
  display: none;
}

.buildstage {
  display: grid;
  gap: 12px;
}

.buildstage__head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.buildstage__num {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 0.72rem;
  color: var(--ink);
  background: var(--accent, var(--gold));
  box-shadow: inset 0 0 0 2px var(--ink);
}

/* ================================================================== POTIONS */

.potionrow {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(13, 21, 34, 0.5);
  box-shadow: inset 0 0 0 2px var(--border-soft);
  flex-wrap: wrap;
}

.potionrow__info {
  flex: 1 1 200px;
  min-width: 0;
}

.potionrow__name {
  font-family: var(--font-pixel);
  font-size: 0.86rem;
  text-transform: uppercase;
}

.potionrow__effect {
  color: var(--success);
  font-size: 0.82rem;
}

.prioritytag {
  font-family: var(--font-pixel);
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 7px;
  flex: none;
}

.prioritytag[data-priority='must'] {
  background: var(--danger);
  color: #170707;
}
.prioritytag[data-priority='useful'] {
  background: var(--gold);
  color: var(--ink);
}
.prioritytag[data-priority='optional'] {
  background: var(--border);
  color: var(--text);
}

/* ===================================================================== NPCS */

.npcrow {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px;
  background: rgba(13, 21, 34, 0.5);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

.npcrow__info {
  min-width: 0;
  flex: 1 1 auto;
}

.npcrow__name {
  font-family: var(--font-pixel);
  font-size: 0.9rem;
  text-transform: uppercase;
  margin: 0 0 4px;
}

/* ================================================================ RESOURCES */

.orechain {
  display: grid;
  gap: 0;
  justify-items: center;
}

.orerow {
  display: flex;
  align-items: center;
  gap: 14px;
  width: min(620px, 100%);
  padding: 12px 14px;
  background: linear-gradient(180deg, var(--panel-light) 0, var(--panel) 32%);
  clip-path: var(--clip-notch);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 6px var(--border-soft);
  text-align: left;
  flex-wrap: wrap;
}

.orerow__names {
  font-family: var(--font-display);
  font-size: 0.76rem;
  text-transform: uppercase;
}

.orerow__info {
  flex: 1 1 220px;
  min-width: 0;
}

/* ============================================================ BEGINNER GUIDE */

.steplist {
  display: grid;
  gap: 10px;
  counter-reset: step;
}

.stepitem {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  background: rgba(13, 21, 34, 0.5);
  box-shadow: inset 0 0 0 2px var(--border-soft);
}

.stepitem__num {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 0.72rem;
  color: var(--ink);
  background: var(--gold);
  box-shadow: inset 0 0 0 2px var(--ink);
}

.stepitem__title {
  font-family: var(--font-pixel);
  font-size: 0.9rem;
  text-transform: uppercase;
  margin: 0 0 3px;
}

/* ================================================================= SETTINGS */

.settingrow {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: rgba(13, 21, 34, 0.5);
  box-shadow: inset 0 0 0 2px var(--border-soft);
  flex-wrap: wrap;
}

.settingrow__info {
  flex: 1 1 220px;
  min-width: 0;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.toggle__track {
  width: 52px;
  height: 26px;
  background: var(--panel-deep);
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--border-soft);
  position: relative;
  flex: none;
}

.toggle__knob {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 18px;
  height: 18px;
  background: var(--border);
  transition: left 0.12s steps(3), background 0.12s;
}

.toggle.is-on .toggle__track {
  box-shadow:
    inset 0 0 0 3px var(--ink),
    inset 0 0 0 5px var(--gold-deep);
}

.toggle.is-on .toggle__knob {
  left: 30px;
  background: var(--gold);
}

.toggle__text {
  font-family: var(--font-pixel);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ============================================================== responsive */

@media (max-width: 720px) {
  .craft {
    grid-template-columns: minmax(130px, 1fr) 22px minmax(130px, 1fr);
  }

  .node {
    padding: 10px;
    gap: 9px;
  }

  .node__name {
    font-size: 0.72rem;
  }

  .whatnext__portrait {
    padding: 8px;
  }

  .arena__tag {
    width: 66px;
    font-size: 0.52rem;
  }
}


/* ==========================================================================
   LIGHT THEME OVERRIDES — page compositions
   ========================================================================== */

:root[data-theme='light'] .hero {
  background:
    radial-gradient(600px 240px at 50% 0%, rgba(201, 138, 30, 0.16), transparent 70%),
    linear-gradient(180deg, #f7f1df 0, #efe4c6 55%, #e7dabb 100%);
}
:root[data-theme='light'] .hero__mark {
  color: #fff8e6;
}

  <script>
(function () {
'use strict';

/* ===== src/core/store.js ===== */
/**
 * Application state + localStorage persistence.
 *
 * All mutations go through this module so every page stays in sync and
 * progress survives a reload. State is intentionally small and serialisable.
 */

const STORAGE_KEY = 'terraguide.state.v1';

/**
 * The polished demo state described in the spec: a Ranger in an Expert
 * Corruption world who has already cleared Eye of Cthulhu + Eater of Worlds,
 * so the app has something meaningful to say on first load.
 */
function demoState() {
  return {
    version: 1,
    setupComplete: false,
    createdAt: Date.now(),
    world: {
      difficulty: 'expert',
      evil: 'corruption',
    },
    player: {
      class: 'ranger',
    },
    /** boss id -> true */
    defeated: {
      king_slime: true,
      eye_of_cthulhu: true,
      eater_of_worlds: true,
    },
    /** arbitrary objective key -> true (checklists, world prep, potions, gear) */
    checks: {
      'gear:mobility': true,
      'gear:hp300': true,
      'boss:skeletron:heal-potions': true,
      'world:pre-hardmode:housing': true,
    },
    display: {
      reducedMotion: false,
      compact: false,
      theme: 'dark', // 'dark' (night) | 'light' (day-in-forest)
    },
  };
}

function blankState() {
  const s = demoState();
  s.defeated = {};
  s.checks = {};
  s.player.class = 'unsure';
  return s;
}

let state = load();
const listeners = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return demoState();
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return demoState();
    // Shallow-merge against defaults so new fields never break an old save.
    const base = demoState();
    return {
      ...base,
      ...parsed,
      world: { ...base.world, ...(parsed.world || {}) },
      player: { ...base.player, ...(parsed.player || {}) },
      display: { ...base.display, ...(parsed.display || {}) },
      defeated: { ...(parsed.defeated || {}) },
      checks: { ...(parsed.checks || {}) },
    };
  } catch {
    return demoState();
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {
    /* storage unavailable (private mode) — app still works for the session */
  }
}

function emit(reason) {
  persist();
  for (const fn of [...listeners]) fn(state, reason);
}

/* ------------------------------------------------------------------ reads */

function getState() {
  return state;
}

function getWorld() {
  return state.world;
}

function getPlayerClass() {
  return state.player.class;
}

function isDefeated(bossId) {
  return Boolean(state.defeated[bossId]);
}

function defeatedCount() {
  return Object.values(state.defeated).filter(Boolean).length;
}

function isChecked(key) {
  return Boolean(state.checks[key]);
}

function checkedCount(keys) {
  return keys.filter((k) => state.checks[k]).length;
}

/* ----------------------------------------------------------------- writes */

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function patch(partial, reason = 'patch') {
  state = { ...state, ...partial };
  emit(reason);
}

function setWorld(partial) {
  state = { ...state, world: { ...state.world, ...partial } };
  emit('world');
}

function setPlayerClass(cls) {
  state = { ...state, player: { ...state.player, class: cls } };
  emit('class');
}

function setDisplay(partial) {
  state = { ...state, display: { ...state.display, ...partial } };
  applyDisplayPreferences();
  emit('display');
}

function completeSetup() {
  state = { ...state, setupComplete: true };
  emit('setup');
}

function setDefeated(bossId, value) {
  const defeated = { ...state.defeated };
  if (value) defeated[bossId] = true;
  else delete defeated[bossId];
  state = { ...state, defeated };
  emit('defeated');
}

function toggleDefeated(bossId) {
  setDefeated(bossId, !isDefeated(bossId));
  return isDefeated(bossId);
}

function setChecked(key, value) {
  const checks = { ...state.checks };
  if (value) checks[key] = true;
  else delete checks[key];
  state = { ...state, checks };
  emit('checks');
}

function toggleChecked(key) {
  setChecked(key, !isChecked(key));
  return isChecked(key);
}

/** Mark a whole group of objective keys (used by "Prepare All"). */
function setCheckedBulk(keys, value) {
  const checks = { ...state.checks };
  for (const key of keys) {
    if (value) checks[key] = true;
    else delete checks[key];
  }
  state = { ...state, checks };
  emit('checks');
}

/**
 * Replace the whole defeated map — used by the setup flow's
 * "starting progress" selector.
 */
function setDefeatedMap(map) {
  state = { ...state, defeated: { ...map } };
  emit('defeated');
}

/* ------------------------------------------------------------------ resets */

function resetAll() {
  state = { ...blankState(), display: state.display, setupComplete: false };
  emit('reset');
}

/** Clear every objective key that starts with one of the given prefixes. */
function resetChecksByPrefix(prefixes) {
  const list = Array.isArray(prefixes) ? prefixes : [prefixes];
  const checks = {};
  for (const [key, value] of Object.entries(state.checks)) {
    if (!list.some((p) => key.startsWith(p))) checks[key] = value;
  }
  state = { ...state, checks };
  emit('reset-stage');
}

/* -------------------------------------------------------------- preferences */

function applyDisplayPreferences() {
  const root = document.documentElement;
  root.classList.toggle('reduced-motion', Boolean(state.display.reducedMotion));
  root.classList.toggle('compact', Boolean(state.display.compact));
  const theme = state.display.theme === 'light' ? 'light' : 'dark';
  root.setAttribute('data-theme', theme);
  root.style.setProperty('color-scheme', theme);
}

function getTheme() {
  return state.display.theme === 'light' ? 'light' : 'dark';
}

function toggleTheme() {
  const next = getTheme() === 'light' ? 'dark' : 'light';
  setDisplay({ theme: next });
  return next;
}

const storageKey = STORAGE_KEY;


/* ===== src/core/router.js ===== */
/**
 * Hash-based router — works from a static host and from file:// alike.
 * Routes are plain patterns: '/bosses/:id'.
 */

const routes = [];
let notFoundRender = () => null;
let onNavigate = () => {};

function defineRoutes(list, { notFound, afterNavigate } = {}) {
  routes.length = 0;
  for (const route of list) routes.push({ ...route, matcher: toMatcher(route.path) });
  if (notFound) notFoundRender = notFound;
  if (afterNavigate) onNavigate = afterNavigate;
}

function toMatcher(path) {
  const keys = [];
  const pattern = path
    .split('/')
    .filter(Boolean)
    .map((segment) => {
      if (segment.startsWith(':')) {
        keys.push(segment.slice(1));
        return '([^/]+)';
      }
      return segment.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    });
  return { regex: new RegExp(`^/${pattern.join('/')}/?$`), keys };
}

function currentPath() {
  const raw = window.location.hash.replace(/^#/, '');
  const path = raw.split('?')[0];
  return path && path.startsWith('/') ? path : '/';
}

function currentQuery() {
  const raw = window.location.hash.replace(/^#/, '');
  const qIndex = raw.indexOf('?');
  return new URLSearchParams(qIndex >= 0 ? raw.slice(qIndex + 1) : '');
}

function navigate(path, { replace = false } = {}) {
  const target = `#${path}`;
  if (window.location.hash === target) {
    render();
    return;
  }
  if (replace) window.history.replaceState(null, '', target);
  else window.history.pushState(null, '', target);
  render();
}

function resolve(path) {
  for (const route of routes) {
    const match = path.match(route.matcher.regex);
    if (match) {
      const params = {};
      route.matcher.keys.forEach((key, i) => {
        params[key] = decodeURIComponent(match[i + 1]);
      });
      return { route, params };
    }
  }
  return null;
}

let outlet = null;
let renderScheduled = false;

function startRouter(targetEl) {
  outlet = targetEl;
  window.addEventListener('hashchange', render);
  window.addEventListener('popstate', render);
  render();
}

/** Re-render the current route (used when global state changes). */
function refresh() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    render({ keepScroll: true, fromState: true });
  });
}

function render({ keepScroll = false, fromState = false } = {}) {
  if (!outlet) return;
  const path = currentPath();
  const found = resolve(path);

  // Some views (the setup wizard) own their internal state and must not be
  // rebuilt when the store changes.
  if (fromState && found && found.route.reactive === false) return;

  const scrollEl = document.scrollingElement || document.documentElement;
  const previousScroll = scrollEl.scrollTop;
  const focusKey = document.activeElement?.dataset?.focusKey || null;

  const view = found
    ? found.route.render({ params: found.params, query: currentQuery(), path })
    : notFoundRender({ path });

  outlet.replaceChildren(view || document.createTextNode(''));
  onNavigate({ path, route: found?.route ?? null, params: found?.params ?? {} });

  if (keepScroll) scrollEl.scrollTop = previousScroll;
  else scrollEl.scrollTop = 0;

  if (focusKey) {
    const restored = outlet.querySelector(`[data-focus-key="${cssEscape(focusKey)}"]`);
    if (restored) restored.focus({ preventScroll: true });
  }
}

function cssEscape(value) {
  if (window.CSS?.escape) return window.CSS.escape(value);
  return value.replace(/["\\]/g, '\\$&');
}


/* ===== src/core/dom.js ===== */
/**
 * Tiny DOM helper layer.
 * Keeps the rest of the app declarative without pulling in a framework.
 */

const SVG_TAGS = new Set(['svg', 'path', 'circle', 'rect', 'line', 'polyline', 'polygon', 'g', 'defs', 'linearGradient', 'stop', 'ellipse']);

/**
 * Create an element.
 *   h('div.card#main', { onclick }, 'text', child)
 *   h('button.pixel-btn', { class: 'is-active', disabled: true })
 *
 * Supported props:
 *   class / className  -> extra classes (string or array)
 *   style              -> object of css properties
 *   dataset            -> object of data attributes
 *   html               -> innerHTML (only used with trusted, app-authored markup)
 *   on<event>          -> addEventListener
 *   anything else      -> setAttribute (aria-*, href, role, ...)
 */
function h(selector, props, ...children) {
  const { tag, id, classes } = parseSelector(selector);
  const el = SVG_TAGS.has(tag)
    ? document.createElementNS('http://www.w3.org/2000/svg', tag)
    : document.createElement(tag);

  if (id) el.id = id;
  for (const c of classes) el.classList.add(c);

  if (props && typeof props === 'object' && !isRenderable(props)) {
    applyProps(el, props);
  } else if (props !== undefined && props !== null) {
    children.unshift(props);
  }

  append(el, children);
  return el;
}

function parseSelector(selector) {
  if (typeof selector !== 'string') return { tag: 'div', id: '', classes: [] };
  const idMatch = selector.match(/#([\w-]+)/);
  const classes = [...selector.matchAll(/\.([\w-]+)/g)].map((m) => m[1]);
  const tag = selector.match(/^[a-zA-Z][\w-]*/)?.[0] || 'div';
  return { tag, id: idMatch ? idMatch[1] : '', classes };
}

function applyProps(el, props) {
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;

    if (key === 'class' || key === 'className') {
      const list = Array.isArray(value) ? value : String(value).split(/\s+/);
      list.filter(Boolean).forEach((c) => el.classList.add(c));
    } else if (key === 'style' && typeof value === 'object') {
      Object.entries(value).forEach(([k, v]) => {
        if (v === null || v === undefined) return;
        if (k.startsWith('--')) el.style.setProperty(k, String(v));
        else el.style[k] = v;
      });
    } else if (key === 'dataset' && typeof value === 'object') {
      Object.entries(value).forEach(([k, v]) => {
        if (v !== null && v !== undefined) el.dataset[k] = String(v);
      });
    } else if (key === 'html') {
      el.innerHTML = value;
    } else if (key === 'text') {
      el.textContent = String(value);
    } else if (key.startsWith('on') && typeof value === 'function') {
      el.addEventListener(key.slice(2).toLowerCase(), value);
    } else if (key === 'ref' && typeof value === 'function') {
      value(el);
    } else if (value === true) {
      el.setAttribute(key, '');
    } else {
      el.setAttribute(key, String(value));
    }
  }
}

function isRenderable(v) {
  return v instanceof Node || Array.isArray(v);
}

function append(el, children) {
  for (const child of children.flat(4)) {
    if (child === null || child === undefined || child === false || child === true) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
}

/** Document fragment from a list of children. */
function frag(...children) {
  const f = document.createDocumentFragment();
  append(f, children);
  return f;
}

/** Remove all children of a node. */
function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

/** Replace the content of a node. */
function mount(node, ...children) {
  clear(node);
  append(node, children);
  return node;
}

function qs(selector, root = document) {
  return root.querySelector(selector);
}

function qsa(selector, root = document) {
  return [...root.querySelectorAll(selector)];
}

/** Event delegation helper. */
function delegate(root, eventName, selector, handler) {
  root.addEventListener(eventName, (event) => {
    const target = event.target.closest(selector);
    if (target && root.contains(target)) handler(event, target);
  });
}

/** Small emoji / glyph icon wrapper so sizing stays consistent. */
function glyph(char, label) {
  return h('span.glyph', { 'aria-hidden': label ? null : 'true', role: label ? 'img' : null, 'aria-label': label || null }, char);
}

/** Star rating: ★★★☆☆ (also exposes an accessible label). */
function stars(value, max = 5) {
  const filled = Math.max(0, Math.min(max, Math.round(value || 0)));
  return h(
    'span.stars',
    { role: 'img', 'aria-label': `${filled} out of ${max}` },
    h('span.stars__on', '★'.repeat(filled)),
    h('span.stars__off', '☆'.repeat(max - filled))
  );
}

/** requestAnimationFrame-batched callback. */
function nextFrame(fn) {
  requestAnimationFrame(() => requestAnimationFrame(fn));
}


/* ===== src/components/background.js ===== */
/**
 * The pixel night-sky environment.
 * Generated once at boot; purely decorative and pointer-transparent.
 */


function rand(min, max) {
  return min + Math.random() * (max - min);
}

function renderSky() {
  const root = document.getElementById('tg-sky');
  if (!root) return;

  const reduced = getState().display.reducedMotion;

  const stars = h('div.tg-sky__stars');
  const starCount = 130;
  for (let i = 0; i < starCount; i += 1) {
    const big = Math.random() > 0.86;
    stars.append(
      h('span.tg-sky__star', {
        class: big ? 'tg-sky__star--big' : null,
        style: {
          left: `${rand(0, 100).toFixed(2)}%`,
          top: `${rand(0, 68).toFixed(2)}%`,
          animationDelay: `${rand(0, 4).toFixed(2)}s`,
          animationPlayState: reduced ? 'paused' : 'running',
        },
      })
    );
  }

  const clouds = h('div');
  for (let i = 0; i < 5; i += 1) {
    clouds.append(
      h('span.tg-sky__cloud', {
        style: {
          top: `${rand(6, 40).toFixed(1)}%`,
          width: `${Math.round(rand(40, 90))}px`,
          animationDelay: `${(-rand(0, 90)).toFixed(1)}s`,
          animationPlayState: reduced ? 'paused' : 'running',
        },
      })
    );
  }

  const trees = h('div.tg-sky__trees');
  for (let i = 0; i < 26; i += 1) {
    trees.append(
      h('span.tg-sky__tree', {
        style: { height: `${Math.round(rand(46, 90))}px`, width: `${Math.round(rand(18, 30))}px` },
      })
    );
  }

  const motes = h('div.tg-sky__particles');
  for (let i = 0; i < 16; i += 1) {
    motes.append(
      h('span.tg-sky__mote', {
        style: {
          left: `${rand(0, 100).toFixed(2)}%`,
          bottom: `${rand(-5, 25).toFixed(1)}%`,
          animationDuration: `${rand(14, 30).toFixed(1)}s`,
          animationDelay: `${(-rand(0, 20)).toFixed(1)}s`,
          animationPlayState: reduced ? 'paused' : 'running',
          background: i % 3 === 0 ? 'var(--ranger)' : 'var(--gold)',
        },
      })
    );
  }

  mount(
    root,
    stars,
    clouds,
    h('div.tg-sky__moon'),
    h('div.tg-sky__sun'),
    h('div.tg-sky__ridge.tg-sky__ridge--far'),
    h('div.tg-sky__ridge.tg-sky__ridge--near'),
    trees,
    h('div.tg-sky__ground'),
    motes
  );
}

/** Bosses relevant to a world: hides the other evil's boss. */
function bossesForWorld(evil) {
  const hidden = evil === 'crimson' ? 'eater_of_worlds' : 'brain_of_cthulhu';
  return BOSSES.filter((b) => b.id !== hidden);
}

/** Preparation objective key for a boss checklist entry. */
function prepKey(bossId, entry) {
  return entry.global || `boss:${bossId}:${entry.id}`;
}

/* ===== src/logic/progression.js ===== */
/**
 * Deterministic progression logic.
 * Everything the UI needs to answer "where am I?" lives here.
 */


/** The 12 milestones that make up "main progress". */
function mainMilestones(evil) {
  return [
    'eye_of_cthulhu',
    evilBossId(evil),
    'skeletron',
    'wall_of_flesh',
    'the_destroyer',
    'the_twins',
    'skeletron_prime',
    'plantera',
    'golem',
    'lunatic_cultist',
    'lunar_events',
    'moon_lord',
  ];
}

/** Which progression stage the player is currently in. */
function currentStageId(state) {
  const d = state.defeated;
  const mechs = MECH_BOSSES.filter((id) => d[id]).length;

  if (d.moon_lord) return 'endgame';
  if (d.lunar_events) return 'moon-lord';
  if (d.lunatic_cultist) return 'lunar';
  if (d.golem) return 'lunar';
  if (d.plantera) return 'post-plantera';
  if (mechs >= 3) return 'pre-plantera';
  if (d.wall_of_flesh) return mechs > 0 ? 'mech' : 'early-hardmode';
  if (d.skeletron) return 'pre-wof';
  if (d.eater_of_worlds || d.brain_of_cthulhu) return 'pre-skeletron';
  if (d.eye_of_cthulhu) return 'pre-skeletron';
  return 'early';
}

function currentStage(state) {
  return STAGE_MAP[currentStageId(state)] || STAGES[0];
}

function isHardmode(state) {
  return Boolean(state.defeated.wall_of_flesh);
}

/** Are this boss's prerequisites satisfied? */
function prerequisitesMet(boss, state) {
  if (!boss?.prerequisites?.length) return true;
  return boss.prerequisites.every((id) => {
    if (id === 'EVIL') return Boolean(state.defeated.eater_of_worlds || state.defeated.brain_of_cthulhu);
    return Boolean(state.defeated[id]);
  });
}

/** 'done' | 'available' | 'locked' */
function bossStatus(boss, state) {
  if (state.defeated[boss.id]) return 'done';
  return prerequisitesMet(boss, state) ? 'available' : 'locked';
}

/** Main progression percentage (0–100). */
function mainProgress(state, evil) {
  const milestones = mainMilestones(evil);
  const done = milestones.filter((id) => state.defeated[id]).length;
  return {
    done,
    total: milestones.length,
    percent: Math.round((done / milestones.length) * 100),
  };
}

/** Every trackable boss/event, ignoring the other world evil. */
function bossProgress(state, evil) {
  const hidden = evil === 'crimson' ? 'eater_of_worlds' : 'brain_of_cthulhu';
  const relevant = BOSSES.filter((b) => b.id !== hidden);
  const done = relevant.filter((b) => state.defeated[b.id]).length;
  return { done, total: relevant.length, percent: Math.round((done / relevant.length) * 100) };
}

/** Preparation percentage: the next boss checklist + the current world-prep section. */
function preparationProgress(state, evil) {
  const keys = new Set();
  const next = nextMainObjective(state, evil);

  if (next?.boss) {
    for (const entry of next.boss.preparation || []) keys.add(prepKey(next.boss.id, entry));
  }
  const section = worldPrepSectionForStage(currentStageId(state));
  if (section) {
    for (const item of section.items) keys.add(item.global || `world:${section.id}:${item.id}`);
  }

  const list = [...keys];
  const done = list.filter((k) => state.checks[k]).length;
  return {
    done,
    total: list.length,
    percent: list.length ? Math.round((done / list.length) * 100) : 0,
    keys: list,
  };
}

function worldPrepSectionForStage(stageId) {
  const order = STAGE_MAP[stageId]?.order ?? 0;
  const bands = [
    { max: 2, id: 'pre-hardmode' },
    { max: 4, id: 'pre-mech' },
    { max: 5, id: 'pre-plantera' },
    { max: 6, id: 'pre-golem' },
    { max: 99, id: 'pre-moon-lord' },
  ];
  const pick = bands.find((b) => order <= b.max);
  return WORLD_PREP.find((s) => s.id === pick.id) || WORLD_PREP[0];
}

/**
 * The next main-chain objective. Returns { boss, reason } or null when the
 * game is finished.
 */
function nextMainObjective(state, evil) {
  const d = state.defeated;
  const mechsLeft = MECH_BOSSES.filter((id) => !d[id]);

  if (d.moon_lord) return null;
  if (d.lunar_events) return { boss: BOSS_MAP.moon_lord, reason: 'The pillars have fallen. Only the Moon Lord remains.' };
  if (d.lunatic_cultist) return { boss: BOSS_MAP.lunar_events, reason: 'Four Celestial Pillars are active. Clear them for Lunar Fragments.' };
  if (d.golem) return { boss: BOSS_MAP.lunatic_cultist, reason: 'Cultists have appeared at the Dungeon entrance.' };
  if (d.plantera) return { boss: BOSS_MAP.golem, reason: 'Explore the Jungle Temple and prepare for Golem.' };
  if (!mechsLeft.length) return { boss: BOSS_MAP.plantera, reason: 'All three mechanical bosses are down. The Jungle bulbs are ready.' };

  if (d.wall_of_flesh) {
    const anyMechDone = MECH_BOSSES.some((id) => d[id]);
    const nextMech = BOSS_MAP[mechsLeft[0]];
    if (anyMechDone) {
      return { boss: nextMech, reason: `Prepare for your next Mechanical Boss — ${mechsLeft.length} remaining.` };
    }
    return {
      boss: nextMech,
      reason: 'You are in Hardmode. Gear up completely before you summon a mechanical boss.',
      hardmodePrep: true,
    };
  }

  if (d.skeletron) return { boss: BOSS_MAP.wall_of_flesh, reason: 'Prepare for the Wall of Flesh — this starts Hardmode permanently.' };
  if (d.eater_of_worlds || d.brain_of_cthulhu) return { boss: BOSS_MAP.skeletron, reason: "You're approaching the Dungeon." };
  if (d.eye_of_cthulhu) {
    return {
      boss: BOSS_MAP[evilBossId(evil)],
      reason: 'Your evil biome boss is next — it unlocks the ore you need.',
    };
  }
  return { boss: BOSS_MAP.eye_of_cthulhu, reason: 'Your first real boss. Build an arena and summon it at night.' };
}

/**
 * Nodes for the progression tree: the main chain with the world's evil boss
 * substituted in and the HARDMODE band kept as a marker.
 */
function mainChainNodes(evil) {
  return MAIN_CHAIN.map((entry) => {
    if (entry === 'EVIL') return { kind: 'boss', boss: BOSS_MAP[evilBossId(evil)] };
    if (entry === 'HARDMODE') return { kind: 'band', label: 'HARDMODE BEGINS', icon: '🔥' };
    return { kind: 'boss', boss: BOSS_MAP[entry] };
  }).filter((node) => node.kind === 'band' || node.boss);
}

/** Bosses at or below the player's current stage that they have not beaten. */
function availableBosses(state, evil) {
  const hidden = evil === 'crimson' ? 'eater_of_worlds' : 'brain_of_cthulhu';
  return BOSSES.filter(
    (b) => b.id !== hidden && !state.defeated[b.id] && prerequisitesMet(b, state)
  );
}

/** Checklist keys for a boss's preparation block. */
function bossPrepKeys(boss) {
  return (boss.preparation || []).map((entry) => prepKey(boss.id, entry));
}

function stageIndexOf(stageId) {
  return STAGE_MAP[stageId]?.order ?? 0;
}

function stageAtOrAfter(stageId, thresholdId) {
  return stageIndexOf(stageId) >= stageIndexOf(thresholdId);
}


/* ===== src/data/item-factory.js ===== */
/**
 * Item factories.
 *
 * Every entry in the item database goes through one of these so the shape
 * stays consistent and the UI never has to guard against missing fields.
 */

const base = (o) => ({
  id: o.id,
  name: o.name,
  sprite: o.sprite || 'unknown',
  tint: o.tint || 'iron',
  type: o.type || 'material',
  subtype: o.subtype || '',
  cls: o.cls || 'universal',
  rarity: o.rarity || 'white',
  stage: o.stage || 'early',
  rating: o.rating ?? 3,
  desc: o.desc || '',
  source: o.source || '',
  craft: o.craft || null,
  usedFor: o.usedFor || [],
  evil: o.evil || null,
  tags: o.tags || [],
  stats: o.stats || {},
  slot: o.slot || '',
});

function weapon(o) {
  return base({
    ...o,
    type: 'weapon',
    stats: {
      Damage: o.dmg != null ? `${o.dmg}` : '—',
      Crit: o.crit != null ? `${o.crit}%` : '4%',
      Knockback: o.kb || 'Average',
      Speed: o.speed || 'Average',
      ...(o.extraStats || {}),
    },
  });
}

function armor(o) {
  return base({
    ...o,
    type: 'armor',
    stats: {
      Defense: o.defense != null ? `${o.defense}` : '—',
      'Set bonus': o.setBonus || '—',
      ...(o.extraStats || {}),
    },
  });
}

function accessory(o) {
  return base({
    ...o,
    type: 'accessory',
    stats: {
      Effect: o.effect || '—',
      ...(o.extraStats || {}),
    },
  });
}

function ammo(o) {
  return base({
    ...o,
    type: 'ammo',
    stats: {
      Damage: o.dmg != null ? `+${o.dmg}` : '—',
      Effect: o.effect || '—',
      ...(o.extraStats || {}),
    },
  });
}

function tool(o) {
  return base({
    ...o,
    type: 'tool',
    stats: {
      Power: o.power || '—',
      Effect: o.effect || '—',
      ...(o.extraStats || {}),
    },
  });
}

function material(o) {
  return base({
    ...o,
    type: 'material',
    stats: {
      Use: o.use || '—',
      ...(o.extraStats || {}),
    },
  });
}

function summonItem(o) {
  return base({
    ...o,
    type: 'summon',
    stats: {
      Summons: o.summons || '—',
      Where: o.where || '—',
      ...(o.extraStats || {}),
    },
  });
}

function potionItem(o) {
  return {
    ...base({
      ...o,
      type: 'potion',
      sprite: 'potion',
      stats: {
        Effect: o.effect || '—',
        Duration: o.duration || '—',
        ...(o.extraStats || {}),
      },
    }),
    // potion-specific fields used by the Potion Guide
    priority: o.priority || 'optional',
    ingredients: o.ingredients || [],
    where: o.where || '',
  };
}

/**
 * The unified item index. Everything searchable lives here.
 */
const ITEMS = [...WEAPONS, ...GEAR, ...MISC_ITEMS, ...POTIONS];

const ITEM_MAP = Object.fromEntries(ITEMS.map((i) => [i.id, i]));

function getItem(id) {
  return ITEM_MAP[id] || null;
}

/** Resolve a list of ids into items, silently dropping unknown ids. */
function resolveItems(ids = []) {
  return ids.map((id) => ITEM_MAP[id]).filter(Boolean);
}

/** Items whose stated craft recipe includes this item. */
function craftedFrom(itemId) {
  return ITEMS.filter((i) => i.craft?.inputs?.some((input) => input.id === itemId));
}

const ITEM_TYPE_FILTERS = [
  { id: 'weapon', label: 'Weapons' },
  { id: 'armor', label: 'Armor' },
  { id: 'accessory', label: 'Accessories' },
  { id: 'ammo', label: 'Ammunition' },
  { id: 'tool', label: 'Tools' },
  { id: 'potion', label: 'Potions' },
  { id: 'material', label: 'Materials' },
  { id: 'summon', label: 'Summoning Items' },
];

const ITEM_CLASS_FILTERS = [
  { id: 'melee', label: 'Melee' },
  { id: 'ranger', label: 'Ranger' },
  { id: 'mage', label: 'Mage' },
  { id: 'summoner', label: 'Summoner' },
  { id: 'universal', label: 'Universal' },
];

/** Coarse progression buckets for the item filter bar. */
const PROGRESSION_FILTERS = [
  { id: 'early', label: 'Early Game', stages: ['early'] },
  { id: 'pre-hardmode', label: 'Pre-Hardmode', stages: ['pre-skeletron', 'pre-wof'] },
  { id: 'early-hardmode', label: 'Early Hardmode', stages: ['early-hardmode', 'mech'] },
  { id: 'mid-hardmode', label: 'Mid Hardmode', stages: ['pre-plantera', 'post-plantera'] },
  { id: 'endgame', label: 'Endgame', stages: ['lunar', 'moon-lord', 'endgame'] },
];

const PROGRESSION_LOOKUP = {};
for (const bucket of PROGRESSION_FILTERS) {
  for (const stage of bucket.stages) PROGRESSION_LOOKUP[stage] = bucket.id;
}

function progressionBucket(stageId) {
  return PROGRESSION_LOOKUP[stageId] || 'early';
}

/**
 * Filter the item database.
 * @param {{types?:string[], classes?:string[], buckets?:string[], query?:string, evil?:string}} options
 */
function filterItems({ types = [], classes = [], buckets = [], query = '', evil = null } = {}) {
  const q = query.trim().toLowerCase();
  return ITEMS.filter((item) => {
    if (types.length && !types.includes(item.type)) return false;
    if (classes.length && !classes.includes(item.cls)) return false;
    if (buckets.length && !buckets.includes(progressionBucket(item.stage))) return false;
    if (evil && item.evil && item.evil !== evil) return false;
    if (q && !item.name.toLowerCase().includes(q) && !item.desc.toLowerCase().includes(q)) return false;
    return true;
  });
}

/** Sort helper: progression order, then rating, then name. */
function sortByProgression(items) {
  return [...items].sort((a, b) => {
    const oa = STAGE_MAP[a.stage]?.order ?? 0;
    const ob = STAGE_MAP[b.stage]?.order ?? 0;
    if (oa !== ob) return oa - ob;
    if (a.rating !== b.rating) return b.rating - a.rating;
    return a.name.localeCompare(b.name);
  });
}

    haystack: `${n.name} ${n.unlock} ${n.why}`.toLowerCase(),
    sprite: 'npc',
    tint: n.tint,
    href: `#/npcs?npc=${n.id}`,
    meta: 'Town NPC',
  })),
  ...ORE_TIERS.map((o) => ({
    id: o.id,
    kind: 'resource',
    kindLabel: 'Resource',
    name: o.names,
    haystack: `${o.names} ${o.where} ${o.crafts.join(' ')}`.toLowerCase(),
    sprite: 'ore',
    tint: o.tint,
    href: `#/resources?ore=${o.id}`,
    meta: `Tier ${o.tier}`,
  })),
];

const GROUP_ORDER = ['boss', 'item', 'potion', 'npc', 'resource'];
const GROUP_LABELS = {
  boss: 'Bosses & Events',
  item: 'Items',
  potion: 'Potions',
  npc: 'NPCs',
  resource: 'Resources',
};

function searchAll(query, limit = 24) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return [];

  const scored = [];
  for (const entry of INDEX) {
    const name = entry.name.toLowerCase();
    let score = 0;
    if (name === q) score = 1000;
    else if (name.startsWith(q)) score = 500 - name.length;
    else if (name.includes(q)) score = 300 - name.indexOf(q);
    else if (entry.haystack.includes(q)) score = 100;
    if (score > 0) scored.push({ ...entry, score });
  }

  scored.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  return scored.slice(0, limit);
}

/** Search results bucketed by kind, ready to render. */
function searchGrouped(query, limit = 24) {
  const results = searchAll(query, limit);
  const groups = new Map();
  for (const r of results) {
    if (!groups.has(r.kind)) groups.set(r.kind, []);
    groups.get(r.kind).push(r);
  }
  return GROUP_ORDER.filter((k) => groups.has(k)).map((kind) => ({
    kind,
    label: GROUP_LABELS[kind],
    results: groups.get(kind),
  }));
}

/* ===== src/core/sprites.js ===== */
/**
 * Pixel-art sprite engine.
 *
 * Sprites are hand-authored character grids. Every grid uses the same
 * symbolic palette so a single shape can be re-tinted for many items:
 *
 *   x  outline / shadow      a  primary        b  primary dark
 *   f  highlight             c  secondary      d  secondary dark
 *   e  accent                g  accent 2       w  white / glow
 *   .  transparent
 *
 * Rendering happens once per (shape + palette) pair into a cached data URL,
 * so a page with 200 item cards still only paints a handful of canvases.
 */


const BASE_PALETTE = {
  x: '#10131c',
  a: '#8b93a5',
  b: '#5b6376',
  f: '#d7dce6',
  c: '#8a5a3b',
  d: '#5d3a25',
  e: '#f2c14e',
  g: '#e76f51',
  w: '#ffffff',
};

const urlCache = new Map();

function normalise(rows) {
  const width = rows.reduce((max, row) => Math.max(max, row.length), 0);
  return { rows: rows.map((row) => row.padEnd(width, '.')), width, height: rows.length };
}

/** Render a shape to a cached PNG data URL. */
function spriteURL(shapeName, paletteOverride = {}) {
  const shape = SHAPES[shapeName] || SHAPES.unknown;
  const palette = { ...BASE_PALETTE, ...(shape.palette || {}), ...paletteOverride };
  const key = `${shapeName}|${Object.entries(palette).map(([k, v]) => k + v).join('')}`;
  const cached = urlCache.get(key);
  if (cached) return cached;

  const { rows, width, height } = normalise(shape.rows);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  for (let y = 0; y < height; y += 1) {
    for (let x = 0; x < width; x += 1) {
      const ch = rows[y][x];
      if (ch === '.' || ch === ' ') continue;
      const color = palette[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }
  }

  const url = canvas.toDataURL('image/png');
  urlCache.set(key, url);
  return url;
}

/**
 * <img> element for a sprite.
 * @param {string} shapeName
 * @param {object} options  { size, palette, alt, className }
 */
function sprite(shapeName, { size = 48, palette = {}, alt = '', className = '' } = {}) {
  const img = document.createElement('img');
  img.className = `sprite ${className}`.trim();
  img.src = spriteURL(shapeName, palette);
  img.width = size;
  img.height = size;
  img.alt = alt;
  img.decoding = 'async';
  if (!alt) img.setAttribute('aria-hidden', 'true');
  img.style.width = `${size}px`;
  img.style.height = `${size}px`;
  return img;
}

/** Framed sprite tile used by item cards, loadout slots and boss nodes. */
function spriteTile(shapeName, { size = 48, palette = {}, alt = '', variant = '' } = {}) {
  const wrap = document.createElement('span');
  wrap.className = `sprite-tile ${variant ? `sprite-tile--${variant}` : ''}`.trim();
  wrap.append(sprite(shapeName, { size, palette, alt }));
  return wrap;
}

function hasSprite(name) {
  return Boolean(SHAPES[name]);
}

  const segment = path.split('/')[1] || 'dashboard';
  if (segment === 'setup') return 'settings';
  return segment;
}

  return h('button.btn', { ...props, type: 'button', onclick: onClick, disabled: disabled || null }, ...kids);

/**
 * Interactive, persistent checklist.
 * @param {Array<{key:string,label:string,note?:string,side?:Node}>} entries
 */
function checklist(entries, { onChange = null, showMeta = true, metaSuffix = 'COMPLETE' } = {}) {
  const done = entries.filter((e) => isChecked(e.key)).length;

  const list = h(
    'div.checklist',
    { role: 'group' },
    entries.map((entry) =>
      h(
        'button.check',
        {
          type: 'button',
          class: isChecked(entry.key) ? 'is-done' : null,
          'aria-pressed': isChecked(entry.key) ? 'true' : 'false',
          dataset: { focusKey: `check:${entry.key}` },
          onclick: (event) => {
            const now = toggleChecked(entry.key);
            if (now) sparkleBurst(event.currentTarget);
            if (onChange) onChange(entry.key, now);
          },
        },
        h('span.check__box', { 'aria-hidden': 'true' }, '✓'),
        h(
          'span.check__label',
          entry.label,
          entry.note ? h('span.check__note', entry.note) : null
        ),
        entry.side ? h('span.check__side', entry.side) : null
      )
    )
  );

  if (!showMeta) return list;

  return frag(
    list,
    h(
      'div.checklist__meta',
      h('span', { class: done === entries.length ? 'success' : null }, `${done} / ${entries.length} ${metaSuffix}`),
      progressBarInline(entries.length ? (done / entries.length) * 100 : 0),
      btn('Prepare all', {
        variant: 'ghost',
        size: 'sm',
        onClick: () => setCheckedBulk(entries.map((e) => e.key), true),
      }),
      done > 0
        ? btn('Clear', {
            variant: 'ghost',
            size: 'sm',
            onClick: () => setCheckedBulk(entries.map((e) => e.key), false),
          })
        : null
    )
  );
}
